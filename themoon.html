<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>월면 탐험</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1c2b52;--navy2:#13203f;--ink:#1d2333;--paper:#f6f7fb;--line:#d6dae5;--accent:#f5c518;--green:#3aa655;--red:#d64545;--blue:#2f6fd0}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:#0b1328;
 background-image:radial-gradient(1px 1px at 20% 30%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 70% 80%,#ffffff44 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 60%,#ffffff33 50%,transparent 51%);background-size:180px 180px,240px 240px,300px 300px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;gap:10px;color:#fff;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:20px;margin:0;font-weight:900;letter-spacing:-.5px}
.top .sp{flex:1}
.chipbtn{background:#ffffff1a;color:#fff;border:1px solid #ffffff33;border-radius:999px;padding:6px 12px;font-size:13px}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stat span{background:#ffffff14;color:#dfe5f5;border-radius:8px;padding:4px 9px;font-size:12px}
.stat b{color:#fff}
.board{background:#e9e4d4;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;box-shadow:inset 0 0 0 3px #d8d0b8}
.cell{position:relative;width:58px;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#f3efe3}
.cell .no{position:absolute;left:4px;top:2px;font-size:9px;color:#9a927c}
.cell.tgt{outline:3px solid var(--accent);cursor:pointer;animation:pulse 1s infinite alternate;background:#fff6c9}
@keyframes pulse{from{outline-color:#f5c518}to{outline-color:#ff8a00}}
.base{width:46px;height:46px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:24px}
.crater{width:38px;height:38px;border-radius:50%;border:2px dashed #b9b09a}
.cube{position:absolute;right:3px;top:3px;width:16px;height:16px;background:#f2d01e;border:1px solid #a88f00;border-radius:3px;box-shadow:2px 2px 0 #c3a800}
.robot,.rover{position:absolute;font-size:20px;left:2px;bottom:0}
.rover{font-size:22px;left:auto;right:0;bottom:-2px}
.pawns{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);display:flex;filter:drop-shadow(0 1px 1px #0008)}
.pawns svg{margin:0 -4px}
.main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:12px;margin-top:12px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--paper);border-radius:16px;padding:14px}
.panel h2{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:6px}
.hint{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.dice{display:flex;gap:8px;align-items:center;margin:8px 0}
.die{width:40px;height:40px;border-radius:9px;background:#f0cf5e;border:2px solid #b3901b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#3d2e00}
.ap{margin-left:auto;text-align:right}
.ap b{font-size:30px;display:block;line-height:1}
.ap small{font-size:11px;color:#667}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.act{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;text-align:left;font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.act .c{background:var(--navy);color:#fff;border-radius:6px;font-size:11px;padding:2px 6px;white-space:nowrap}
.act .c.sp{background:#2e8b57}
.act.on{border-color:var(--accent);background:#fff6c9;box-shadow:0 0 0 2px var(--accent)}
.act:disabled{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;background:var(--navy);color:#fff}
.btn.sec{background:#e3e6ef;color:var(--ink)}
.btn.warn{background:#c0392b}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rolecard{border-radius:12px;overflow:hidden;background:#fff;border:1px solid #c9cfdc;box-shadow:0 2px 6px #0002;max-width:340px}
.rolecard .h{background:var(--navy);color:#fff;font-weight:900;text-align:right;padding:9px 14px;font-size:17px}
.rolecard .b{padding:12px 14px;font-size:14px;line-height:1.55;font-weight:500;color:var(--navy2);display:flex;gap:10px;align-items:center}
.rolecard .b svg{flex:none}
.pl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.pl.cur{border:2px solid var(--accent);box-shadow:0 0 0 3px #f5c51833}
.pl.done{opacity:.75}
.plh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
.plh .tag{font-size:11px;font-weight:500;background:#eef0f6;border-radius:6px;padding:2px 6px}
.plh .rl{font-size:12px;border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:6px;padding:2px 7px}
.slots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.slot{width:46px;height:62px;border-radius:7px;border:2px solid var(--navy);background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.slot::before,.slot::after{content:'';position:absolute;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--navy) 0 6px,transparent 6px 9px)}
.slot::before{top:3px}.slot::after{bottom:3px}
.slot.empty .ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--navy)}
.slot.click{cursor:pointer;outline:3px solid var(--accent)}
.slot.sel{outline:3px solid #ff8a00;background:#fff3d6}
.o2{width:36px;height:50px;border-radius:5px;background:#c9ccd3;border:1px solid #8c919c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#333;z-index:1}
.o2.x3{background:#cfe0ff;border-color:var(--blue);color:#103a85}
.o2 .bub{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.o2 .bub i{width:10px;height:7px;border-radius:50%;border:2px solid currentColor;display:block}
.storm{background:repeating-radial-gradient(circle,#d64545 0 3px,#fbe3e3 3px 6px)}
.log{margin-top:12px;background:#ffffff10;color:#cfd6ea;border-radius:12px;padding:10px 12px;font-size:12.5px;max-height:170px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px dashed #ffffff14}
.modalbg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{background:var(--paper);border-radius:16px;padding:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.modal table{border-collapse:collapse;width:100%;font-size:13px}
.modal td,.modal th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.modal th{background:#eef0f6}
.modal p,.modal li{font-size:14px;line-height:1.6}
.share{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setup{max-width:640px;margin:30px auto;background:var(--paper);border-radius:18px;padding:22px}
.setup h1{margin:0 0 4px;font-weight:900}
.setup .sub{color:#556;font-size:14px;margin-bottom:16px}
.setup label{font-size:13px;font-weight:700;display:block;margin:14px 0 6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:700;font-size:15px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prow input,.prow select{flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px}
.big{font-size:42px;font-weight:900;margin:6px 0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#556;margin-top:8px;align-items:center}
.legend span{display:flex;align-items:center;gap:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ROLES=[
 {k:'기술자',d:'자기 차례를 시작할 때 로봇을 0~2칸 움직일 수 있습니다. 대원들은 로봇이 있는 칸을 뛰어넘을 수 있지만, 로봇이 서 있는 보급품은 회수할 수 없습니다.'},
 {k:'운반자',d:'컨테이너 카드를 6장 가집니다.'},
 {k:'분위기 메이커',d:'굴린 주사위 눈이 모두 같으면 그 차례에 3AP를 더 얻습니다.'},
 {k:'정비공',d:'차례마다 한 번, 1AP로 \'산소통 활성화\'를 할 수 있습니다.'},
 {k:'조사관',d:'차례마다 한 번, 1AP로 가지고 있는 보급품 하나를 뒤집어 내용을 확인할 수 있습니다.'},
 {k:'발명가',d:'차례마다 한 번, 1AP로 \'경로 개척\'을 할 수 있습니다. 경로 조각이 놓인 보급품 위로 이동할 수 있고, 뛰어넘을 수도 있습니다.'},
 {k:'베테랑',d:'\'보급품 회수\'에 2AP만 씁니다.'},
 {k:'비행 의무관',d:'차례마다 한 번, 0AP로 인접한 대원과 \'컨테이너 공유\'를 할 수 있습니다.'},
 {k:'운동선수',d:'자기 차례를 시작할 때 활성화된 산소통 위에 서 있으면 2AP를 얻습니다.'},
 {k:'깍두기',d:'차례마다 한 번 주사위를 다시 던질 수 있습니다. 단, 모든 주사위를 한꺼번에 던져야 합니다.'},
];
const ROVER_TEXT='\'이동\' 행동으로 최대 2칸까지 이동합니다. \'보급품 회수\', \'경로 개척\', \'산소통 활성화\'는 할 수 없습니다.';
const COLORS=[{n:'검정',c:'#2b2b33'},{n:'빨강',c:'#d9433f'},{n:'하늘',c:'#3fb6cf'},{n:'보라',c:'#7051a8'},{n:'흰색',c:'#f4f4f4'}];
const THRESH={2:5,3:7,4:8,5:9};
const KEY='moon_explore_v1';
let S=null;
let UI={mode:null,sel:null,share:null,modal:null};
let setup={n:3,names:['','','','',''],roles:['랜덤','랜덤','랜덤','랜덤','랜덤'],easy:0};

const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idx=id=>S.sp.findIndex(s=>s.id===id);
const P=()=>S.players[S.cur];
function log(m){S.log.unshift(m);if(S.log.length>80)S.log.pop()}

/* ---------- SVG bits ---------- */
const MEEPLE='M12 1.5a3.3 3.3 0 1 1 0 6.6a3.3 3.3 0 0 1 0-6.6zM3.6 10.2c2.3-1 5.3-1.3 8.4-1.3s6.1.3 8.4 1.3c.9.4.8 1.7-.1 1.9l-4.6 1.1 2.7 7.6c.3.8-.3 1.6-1.1 1.6h-2.4L12 17.6 9.1 22.4H6.7c-.8 0-1.4-.8-1.1-1.6l2.7-7.6-4.6-1.1c-.9-.2-1-1.5-.1-1.9z';
const meeple=(c,sz=22)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}"><path d="${MEEPLE}" fill="${c}" stroke="#000" stroke-opacity=".55" stroke-width="1"/></svg>`;
const SHAPES={3:'<polygon points="20,4 37,34 3,34"',4:'<rect x="4" y="5" width="32" height="30" rx="7"',5:'<polygon points="20,3 37,15 31,35 9,35 3,15"'};
function tileSVG(z,sz=40,opt={}){
 const fill=opt.reveal?(opt.ok?'#3aa655':'#d64545'):'#7d8494';
 const label=opt.reveal?(opt.ok?'✓':'✗'):z;
 let mark='';
 if(!opt.reveal&&opt.seen!=null) mark=`<circle cx="33" cy="8" r="7" fill="${opt.seen?'#3aa655':'#d64545'}" stroke="#fff" stroke-width="1.5"/><text x="33" y="11.5" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">${opt.seen?'✓':'✗'}</text>`;
 if(opt.dropped) mark+=`<circle cx="7" cy="8" r="5" fill="#f5c518"/>`;
 return `<svg viewBox="0 0 40 40" width="${sz}" height="${sz}">${SHAPES[z]} fill="${fill}" stroke="#3d4250" stroke-width="2"/><text x="20" y="${z==3?30:25}" text-anchor="middle" font-size="${opt.reveal?15:12}" font-weight="900" fill="#fff">${label}</text>${mark}</svg>`;
}
const CHIP='<svg viewBox="0 0 40 40" width="34" height="34"><circle cx="20" cy="20" r="16" fill="#1c2b52"/><path d="M13 13l14 14M27 13L13 27" stroke="#c9cfdc" stroke-width="4.5" stroke-linecap="round"/></svg>';
const tankSVG=a=>`<svg viewBox="0 0 30 44" width="28" height="42"><path d="M3 4h24v30l-5 6h-4l-3-4-3 4H8l-5-6z" fill="${a?'#1c2b52':'#d64545'}"/><text x="15" y="13" text-anchor="middle" font-size="6.5" font-weight="900" fill="#fff">OGS</text><circle cx="15" cy="24" r="6" fill="#fff"/>${a?'<path d="M12 24l2.2 2.2L18.5 21.5" stroke="#1c2b52" stroke-width="2" fill="none"/>':'<path d="M12.5 21.5l5 5M17.5 21.5l-5 5" stroke="#d64545" stroke-width="2"/>'}</svg>`;
function o2HTML(n){return `<div class="o2 ${n==3?'x3':''}"><div class="bub">${'<i></i>'.repeat(n)}</div>${n}×O₂</div>`}

/* ---------- Setup ---------- */
function newGame(){
 const n=setup.n;
 const chosen=setup.roles.slice(0,n);
 const fixed=chosen.filter(r=>r!=='랜덤');
 if(new Set(fixed).size!==fixed.length){showModal('<h3>역할이 겹쳐요</h3><p>같은 역할을 두 명이 고를 수 없습니다.</p><div class="row"><button class="btn" data-act="closeModal">확인</button></div>');return}
 const pool=shuffle(ROLES.map(r=>r.k).filter(k=>!fixed.includes(k)));
 const roles=chosen.map(r=>r==='랜덤'?pool.pop():r);
 let nid=0;const sp=[{id:nid++,type:'base'}];
 const mk=(z,ok,br)=>shuffle([...Array(ok).fill(true),...Array(br).fill(false)]).map(v=>({id:nid++,type:'supply',tile:{z,ok:v,seen:null}}));
 sp.push(...mk(3,3,4),...mk(4,4,3),...mk(5,5,2));
 const endSpace={id:nid++,type:'end'};sp.push(endSpace);
 const deck=shuffle([...Array(10).fill(2),...Array(5).fill(3)].map(v=>({t:'o2',n:v})));
 const players=roles.map((r,i)=>{
  const cont=Array(r==='운반자'?6:5).fill(null);
  for(let k=0;k<3;k++)cont[k]=deck.pop();
  return {name:(setup.names[i]||'').trim()||`대원 ${i+1}`,color:COLORS[i].c,cname:COLORS[i].n,role:r,pos:0,containers:cont,returned:false,onRover:false};
 });
 S={sp,nextId:nid,players,draw:[],discard:[{t:'storm'},...deck],stormsLeft:3,tanksLeft:5,pathsLeft:10,
   robot:roles.includes('기술자')?0:null,rover:{pos:endSpace.id,rider:null},cur:rnd(n),phase:'start',dice:[],ap:0,used:{},robotSteps:0,
   athlete:false,acted:false,undo:[],log:[],easy:setup.easy,target:THRESH[n]-setup.easy,result:null};
 log(`게임 시작! 목표: 온전한 보급품 ${S.target}개 이상. ${P().name} 대원부터 시작합니다.`);
 UI={mode:null,sel:null,share:null,modal:null};
 beginTurn();render();
}

/* ---------- Turn flow ---------- */
function hasO2(p){return p.containers.some(c=>c&&c.t==='o2')}
function onActiveTank(p){const s=S.sp[idx(p.pos)];return s&&s.type==='tank'&&s.active}
function beginTurn(){
 if(S.players.every(p=>p.returned))return endGame();
 const p=P();
 S.used={};S.robotSteps=0;S.dice=[];S.ap=0;S.undo=[];S.acted=false;UI.mode=null;UI.sel=null;
 if(!hasO2(p)){return failGame(`${p.name} 대원이 차례를 시작할 때 산소 카드가 없었습니다.`)}
 S.athlete=p.role==='운동선수'&&onActiveTank(p);
 S.phase='start';
}
function nextTurn(){
 if(S.players.every(p=>p.returned))return endGame();
 do{S.cur=(S.cur+1)%S.players.length}while(S.players[S.cur].returned);
 beginTurn();
}
function pickO2(ci){
 const p=P();const c=p.containers[ci];if(!c||c.t!=='o2')return;
 p.containers[ci]=null;S.discard.push(c);
 S.nDice=c.n;rollDice();S.phase='act';UI.mode=null;
 log(`${p.name}: ${c.n}×O₂ 카드를 쓰고 주사위 ${c.n}개 → [${S.dice.join(', ')}] = ${S.ap}AP`);
}
function rollDice(){
 S.dice=Array.from({length:S.nDice},()=>1+rnd(3));
 let ap=S.dice.reduce((a,b)=>a+b,0);S.bonus=[];
 if(P().role==='분위기 메이커'&&S.dice.every(d=>d===S.dice[0])){ap+=3;S.bonus.push('분위기 메이커 +3')}
 if(S.athlete){ap+=2;S.bonus.push('운동선수 +2')}
 S.ap=ap;
}
function reroll(){
 if(P().role!=='깍두기'||S.used.kk||S.acted)return;
 S.used.kk=true;rollDice();log(`${P().name}(깍두기): 주사위 다시 굴림 → [${S.dice.join(', ')}] = ${S.ap}AP`);
}
function endActions(){
 const p=P();UI.mode=null;S.undo=[];
 if(onActiveTank(p)){S.phase='refill';S.stormed=false;log(`${p.name}: 활성화된 산소통 위에서 차례를 마칩니다. 산소 보충 가능.`)}
 else nextTurn();
}
function drawCard(){
 const p=P();
 const empty=p.containers.findIndex(c=>c===null);
 if(empty<0||S.stormed)return;
 if(S.draw.length===0){
  if(S.discard.length===0){log('카드 더미와 버리는 더미가 모두 비어 있습니다.');return}
  S.draw=shuffle(S.discard);S.discard=[];
  let msg='카드 더미가 비어 버리는 더미를 섞어 새 카드 더미를 만들었습니다.';
  if(S.stormsLeft>0){S.discard.push({t:'storm'});S.stormsLeft--;msg+=' 새 자기 폭풍 카드 1장이 버리는 더미에 놓입니다.'}
  log(msg);
 }
 const c=S.draw.pop();
 if(c.t==='storm'){
  S.discard.push(c);S.stormed=true;
  const s=S.sp[idx(p.pos)];s.active=false;
  log(`⚡ ${p.name}: 자기 폭풍! 이 산소통은 고장 나서 더 이상 보충할 수 없습니다.`);
  showModal(`<h3>⚡ 자기 폭풍!</h3><div class="row" style="align-items:center"><div class="o2 storm" style="width:60px;height:84px"></div><p style="margin:0 0 0 10px">${esc(p.name)} 대원이 서 있는 산소통이 고장 났습니다.<br>산소통이 뒤집히고, 더 이상 보충할 수 없습니다.</p></div><div class="row"><button class="btn" data-act="closeModal">확인</button></div>`);
 }else{p.containers[empty]=c;log(`${p.name}: 산소 카드 ${c.n}×O₂를 보충했습니다.`)}
}
function endGame(){
 let ok=0;const rows=[];
 S.players.forEach(p=>{p.containers.forEach(c=>{if(c&&c.t==='sup'&&c.tile.ok)ok++})});
 S.phase='over';S.result={win:ok>=S.target,ok};
 log(`모든 대원 귀환! 온전한 보급품 ${ok}개 (목표 ${S.target}개) → ${ok>=S.target?'임무 성공':'구조 대기'}`);
}
function failGame(reason){S.phase='over';S.result={fail:true,reason};log('임무 실패: '+reason)}

/* ---------- Geometry ---------- */
function playerIdxAt(id){return S.players.findIndex(p=>p.pos===id)}
function step(i,dir,allowPath,forRobot){
 let j=i+dir;
 while(j>=0&&j<S.sp.length){
  const s=S.sp[j];
  if(s.type==='base')return j;
  const pl=S.players.some((p,k)=>p.pos===s.id&&(forRobot||k!==S.cur));
  const rb=!forRobot&&S.robot===s.id;
  const pa=s.path&&!allowPath;
  if(pl||rb||pa){j+=dir;continue}
  return j;
 }
 return -1;
}
function neighbors(){const i=idx(P().pos);return [i-1,i+1].filter(j=>j>=0&&j<S.sp.length)}
function moveTargets(){
 const p=P(),i=idx(p.pos),out=new Set();
 for(const d of [-1,1]){
  const firsts=[step(i,d,false)];
  if(p.role==='발명가')firsts.push(step(i,d,true));
  for(const a of firsts){
   if(a<0)continue;out.add(S.sp[a].id);
   if(p.onRover&&S.sp[a].type!=='base'){const b=step(a,d,false);if(b>=0)out.add(S.sp[b].id)}
  }
 }
 return [...out];
}
function free(s){return playerIdxAt(s.id)<0&&S.robot!==s.id&&S.rover.pos!==s.id&&!s.path}
function collectTargets(){return neighbors().map(j=>S.sp[j]).filter(s=>s.type==='supply'&&s.tile&&free(s)).map(s=>s.id)}
function pathTargets(){return neighbors().map(j=>S.sp[j]).filter(s=>s.type==='supply'&&free(s)).map(s=>s.id)}
function gapTargets(){return neighbors().map(j=>S.sp[j].id)}
function shareTargets(){
 const p=P(),i=idx(p.pos);
 return S.players.map((q,k)=>k).filter(k=>{
  const q=S.players[k];if(k===S.cur||q.returned)return false;
  const j=idx(q.pos);
  return Math.abs(j-i)===1||(i===0&&j===0);
 });
}
function robotTargets(){
 if(S.robot==null||S.robotSteps>=2)return[];
 const i=idx(S.robot);return [-1,1].map(d=>step(i,d,false,true)).filter(j=>j>=0).map(j=>S.sp[j].id);
}
function cost(a){
 const p=P(),r=p.role,u=S.used;
 return {move:1,collect:r==='베테랑'?2:3,tank:(r==='정비공'&&!u.mech)?1:3,path:(r==='발명가'&&!u.inv)?1:2,share:(r==='비행 의무관'&&!u.med)?0:1,drop:1,inspect:1}[a];
}
function emptySlot(p){return p.containers.findIndex(c=>c===null)}

/* ---------- Actions ---------- */
function pushUndo(){const c=Object.assign({},S);delete c.undo;S.undo.push(JSON.stringify(c));S.acted=true}
function undo(){if(!S.undo.length)return;const u=S.undo;const prev=JSON.parse(u.pop());prev.undo=u;S=prev;UI.mode=null;UI.sel=null;UI.share=null;UI.modal=null}
function spend(a){S.ap-=cost(a);const r=P().role;
 if(a==='tank'&&r==='정비공'&&!S.used.mech&&cost(a)===1)S.used.mech=true;
 if(a==='path'&&r==='발명가'&&!S.used.inv)S.used.inv=true;
 if(a==='share'&&r==='비행 의무관'&&!S.used.med)S.used.med=true;
 if(a==='inspect')S.used.insp=true;
}
function insertBetween(tid,obj){const i=idx(P().pos),j=idx(tid);S.sp.splice(j>i?i+1:i,0,obj)}
function target(id){
 const p=P();
 if(S.phase==='start'&&UI.mode==='robot'){S.robot=id;S.robotSteps++;log(`${p.name}(기술자): 로봇 이동`);if(S.robotSteps>=2)UI.mode=null;return}
 const m=UI.mode;
 if(m==='move'){
  pushUndo();spend('move');p.pos=id;
  if(p.onRover)S.rover.pos=id;
  const s=S.sp[idx(id)];
  if(s.type==='base'){p.returned=true;log(`🏠 ${p.name}: 기지로 귀환했습니다!`);UI.mode=null;S.undo=[];nextTurn();return}
  if(!p.onRover&&S.rover.rider==null&&S.rover.pos===id){p.onRover=true;S.rover.rider=S.cur;S.ap=0;UI.mode=null;log(`🛻 ${p.name}: 월면차에 탑승! (이번 차례 AP는 0이 됩니다)`);return}
  if(S.ap<1)UI.mode=null;
 }else if(m==='collect'){
  pushUndo();spend('collect');const s=S.sp[idx(id)];
  const z=s.tile.z;p.containers[emptySlot(p)]={t:'sup',tile:s.tile};s.tile=null;s.chip=true;
  log(`📦 ${p.name}: 제${z}구역 보급품을 회수했습니다.`);UI.mode=null;
 }else if(m==='tank'){
  pushUndo();spend('tank');S.tanksLeft--;insertBetween(id,{id:S.nextId++,type:'tank',active:true});log(`🟦 ${p.name}: 산소통 활성화`);UI.mode=null;
 }else if(m==='path'){
  pushUndo();spend('path');S.pathsLeft--;S.sp[idx(id)].path=true;log(`🟨 ${p.name}: 경로 개척`);UI.mode=null;
 }else if(m==='drop'){
  if(UI.sel==null)return;
  pushUndo();spend('drop');const it=p.containers[UI.sel];p.containers[UI.sel]=null;
  insertBetween(id,{id:S.nextId++,type:'supply',tile:it.tile,dropped:true});log(`${p.name}: 보급품 하나를 내려놓았습니다.`);UI.mode=null;UI.sel=null;
 }
}
function slotClick(pi,ci){
 const p=S.players[pi];
 if(UI.share!=null){ // share modal transfers
  const other=pi===S.cur?S.players[UI.share]:P();
  const e=emptySlot(other);if(e<0)return;
  other.containers[e]=p.containers[ci];p.containers[ci]=null;return;
 }

  const t=p.containers[ci].tile;showModal(`<h3>조사 결과</h3><div class="row" style="align-items:center">${tileSVG(t.z,70,{reveal:true,ok:t.ok})}<p style="margin-left:10px">제${t.z}구역 보급품은 <b>${t.ok?'온전한 보급품':'고장 난 보급품'}</b>입니다.</p></div><div class="row"><button class="btn" data-act="closeModal">확인</button></div>`)}
}
function chooseAct(a){

}
function openShare(k){pushUndo();spend('share');UI.share=k;UI.mode=null;log(`🤝 ${P().name} ↔ ${S.players[k].name}: 컨테이너 공유`)}

 if(c){cls='';inner=c.t==='o2'?o2HTML(c.n):tileSVG(c.tile.z,38,{seen:showSeen?c.tile.seen:null,reveal:S.phase==='over'&&!S.result.fail,ok:c.tile.ok})}

 if(S.phase==='start'){

  }

 }else if(S.phase==='act'){

function setupHTML(){
 let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
 const rows=Array.from({length:setup.n},(_,i)=>`<div class="prow">${meeple(COLORS[i].c,30)}<input data-in="name" data-i="${i}" placeholder="대원 ${i+1} (${COLORS[i].n})" value="${esc(setup.names[i])}"><select data-in="role" data-i="${i}"><option ${setup.roles[i]==='랜덤'?'selected':''}>랜덤</option>${ROLES.map(r=>`<option ${setup.roles[i]===r.k?'selected':''}>${r.k}</option>`).join('')}</select></div>`).join('');
 return `<div class="setup"><h1>🌕 월면 탐험</h1><div class="sub">자기 폭풍에 흩어진 보급품을 회수해 모두 함께 기지로 돌아오는 협동 게임. 한 화면을 돌려가며 함께 플레이해요.</div>
 ${saved?`<div class="row" style="margin-bottom:6px"><button class="btn" data-act="resume">▶ 진행 중인 게임 이어하기</button></div>`:''}
 <label>플레이어 수</label><div class="seg">${[2,3,4,5].map(n=>`<button class="${setup.n===n?'on':''}" data-act="setN" data-k="${n}">${n}인</button>`).join('')}</div>
 <label>대원 이름 · 역할 (고민해서 고르거나 랜덤)</label>${rows}
 <label>난이도 (처음 도전하는 대원이 많으면 목표를 낮춰도 좋아요)</label><div class="seg">${[[0,'기본'],[2,'목표 -2'],[3,'목표 -3']].map(([v,t])=>`<button class="${setup.easy===v?'on':''}" data-act="setEasy" data-k="${v}">${t}</button>`).join('')}</div>
 <p style="font-size:13px;color:#556">목표: 온전한 보급품 <b>${THRESH[setup.n]-setup.easy}개</b> 이상 가지고 모두 귀환</p>
 <div class="row"><button class="btn" style="flex:1;padding:14px" data-act="start">게임 시작</button><button class="btn sec" data-act="help">규칙 보기</button></div>
 <div style="margin-top:16px"><b style="font-size:13px">역할 카드</b><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:6px">${ROLES.map(r=>roleCard(r.k)).join('')}</div></div></div>`;
}
const HELP=`<h3>규칙 요약</h3>
<p><b>목표</b> — 흩어진 보급품을 회수해 모든 대원이 기지로 돌아오세요. 기지 근처(제3구역)는 고장 난 보급품이 많고, 멀리(제5구역)는 온전한 보급품이 많아요. 보급품은 뒷면(구역 번호)만 보입니다.</p>
<p><b>차례 진행</b><br>① 내 컨테이너의 산소 카드 1장을 버리고 주사위를 굴려요 (2×O₂ → 2개, 3×O₂ → 3개, 눈은 1~3). 합계가 이번 차례의 AP!<br>② AP로 행동해요. 순서 자유, 반복 가능, 남은 AP는 사라져요.<br>③ 활성화된 산소통 위에서 차례를 마치면 산소 카드를 보충할 수 있어요.</p>
<table><tr><th>행동</th><th>AP</th><th>내용</th></tr>
<tr><td>이동</td><td>1</td><td>옆 칸으로 이동. 다른 대원·경로 조각·로봇이 있는 칸은 뛰어넘어요.</td></tr>
<tr><td>산소통 활성화</td><td>3</td><td>내 말과 옆 칸 사이에 산소통을 놓아요.</td></tr>
<tr><td>경로 개척</td><td>2</td><td>옆 보급품 위에 경로 조각을 놓아요. 이동할 때 반드시 뛰어넘어요.</td></tr>
<tr><td>컨테이너 공유</td><td>1</td><td>옆에 있는 대원과 산소 카드·보급품을 마음대로 주고받아요.</td></tr>
<tr><td>보급품 회수</td><td>3</td><td>옆의 뒷면 보급품을 빈 컨테이너로 가져와요. 대원·경로 조각·로봇·월면차가 있는 보급품은 안 돼요.</td></tr>
<tr><td>보급품 버리기</td><td>1</td><td>내 말과 옆 칸 사이에 가진 보급품을 내려놓아요.</td></tr></table>
<p><b>산소 보충</b> — 카드 더미에서 1장씩 원하는 만큼(빈 컨테이너가 있는 동안) 가져와요. 카드 더미가 비어 있으면 버리는 더미를 섞어 새 더미를 만들고, 자기 폭풍 카드 1장을 버리는 더미에 추가해요(최대 4장). 자기 폭풍 카드를 뽑으면 그 산소통은 고장 나요.</p>
<p><b>월면차</b> — 월면차 칸에 도착하면 그 차례 AP는 0이 되고 반드시 탑승해요. 다음 차례부터 1AP로 최대 2칸 이동하지만 회수·경로 개척·산소통 활성화는 못 해요. 한 명만, 내릴 수 없어요.</p>
<p><b>게임 종료</b> — 누군가 차례를 시작할 때 산소 카드가 없으면 실패(차례 전에 공유로 받아 두세요!). 모든 대원이 기지로 돌아오면 보급품을 공개해 온전한 보급품을 셉니다. 2인 5개, 3인 7개, 4인 8개, 5인 9개 이상이면 성공. 기지로 돌아간 대원은 다시 나갈 수 없고 차례를 건너뛰어요.</p>
<div class="row"><button class="btn" data-act="closeModal">닫기</button></div>`;

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,k=el.dataset.k;
 switch(a){
  case 'setN':setup.n=+k;break;
  case 'setEasy':setup.easy=+k;break;
  case 'start':newGame();return;
  case 'resume':try{S=JSON.parse(localStorage.getItem(KEY))}catch(err){S=null}UI={mode:null,sel:null,share:null,modal:null};break;
  case 'help':UI.modal=HELP;break;
  case 'closeModal':UI.modal=null;break;
  case 'askNew':UI.modal=`<h3>새 게임을 시작할까요?</h3><p>지금 게임은 사라집니다.</p><div class="row"><button class="btn warn" data-act="newgame">새 게임</button><button class="btn sec" data-act="closeModal">취소</button></div>`;break;
  case 'newgame':S=null;UI={mode:null,sel:null,share:null,modal:null};try{localStorage.removeItem(KEY)}catch(err){}break;
  case 'role':UI.modal=roleCard(k)+'<div class="row"><button class="btn" data-act="closeModal">닫기</button></div>';break;
  case 'rovercard':UI.modal=roleCard(null,true)+'<div class="row"><button class="btn" data-act="closeModal">닫기</button></div>';break;
  case 'robot':UI.mode=UI.mode==='robot'?null:'robot';break;
  case 'reroll':reroll();break;
  case 'choose':chooseAct(k);break;
  case 'shareWith':openShare(+k);break;
  case 'shareDone':UI.share=null;break;
  case 'tgt':target(+el.dataset.id);break;
  case 'slot':slotClick(+el.dataset.p,+el.dataset.c);break;
  case 'undo':undo();break;
  case 'endact':endActions();break;
  case 'draw':drawCard();break;
  case 'endturn':S.stormed=false;nextTurn();break;
 }
 render();
});
document.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset.in)return;const i=+t.dataset.i;
 if(t.dataset.in==='name')setup.names[i]=t.value;
 if(t.dataset.in==='role')setup.roles[i]=t.value;
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.in==='role'){setup.roles[+t.dataset.i]=t.value}});
render();
</script>
</body>
</html>
