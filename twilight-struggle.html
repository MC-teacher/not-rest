<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>황혼의 투쟁 — 냉전 1대1</title>
<style>:root {
  --ink: #1d2230; --paper: #f3ecdc; --paper2: #e8dfc8; --us: #1f5fae; --us-l: #dbe7f7; --ussr: #b8262b; --ussr-l: #f7dcdc;
  --gold: #e0b43c; --bg: #20262f; --bg2: #2b333f; --line: #6c7686; --ok: #2e8b57;
  --font: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: #eef1f5; font-family: var(--font); }
button { font-family: inherit; }
.hidden { display: none !important; }

/* ---------- 타이틀 ---------- */
#title { position: fixed; inset: 0; min-height: 100vh; overflow-y: auto; background:
  radial-gradient(circle at 30% 20%, rgba(184,38,43,.35), transparent 55%),
  radial-gradient(circle at 75% 80%, rgba(31,95,174,.38), transparent 55%), #161b22; z-index: 50; }
.title-inner { max-width: 560px; margin: 0 auto; padding: 48px 22px 40px; text-align: center; }
.title-inner h1 { font-size: 46px; margin: 0; letter-spacing: 6px; font-weight: 900; }
.title-inner h1 span { color: var(--ussr); }
.title-inner .sub { color: #b9c2cf; margin: 6px 0 28px; font-size: 15px; letter-spacing: 1px; }
.side-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.side-btn { border: 2px solid transparent; border-radius: 14px; padding: 18px 10px; color: #fff; font-size: 20px; font-weight: 800; cursor: pointer; }
.side-btn small { display: block; font-size: 12px; font-weight: 500; opacity: .85; margin-top: 6px; line-height: 1.4; }
.side-btn.us { background: linear-gradient(160deg, #2b6fc2, #163e75); }
.side-btn.ussr { background: linear-gradient(160deg, #c8343a, #7a1418); }
.side-btn.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(224,180,60,.35); }
.opt-row { display: flex; align-items: center; justify-content: center; gap: 8px; color: #cfd6df; font-size: 14px; margin: 10px 0 22px; }
.big-btn { width: 100%; padding: 16px; font-size: 19px; font-weight: 800; border: 0; border-radius: 12px; background: var(--gold); color: #231a00; cursor: pointer; }
.ghost-btn { width: 100%; margin-top: 10px; padding: 12px; font-size: 15px; border: 1px solid #5a6475; border-radius: 12px; background: transparent; color: #dfe5ec; cursor: pointer; }
.credit { font-size: 12px; color: #8792a2; margin-top: 26px; line-height: 1.6; }

/* ---------- 상단 상태 ---------- */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 620px; }
#status { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 5px 6px; background: #11151b; border-bottom: 1px solid #333c49; font-size: 12.5px; }
.pill { padding: 3px 7px; border-radius: 999px; background: var(--bg2); white-space: nowrap; }
.pill b { font-weight: 800; }
.defcon { color: #111; font-weight: 800; }
.d5 { background: #4caf50; } .d4 { background: #9ccc65; } .d3 { background: #ffd54f; } .d2 { background: #ff8a3d; } .d1 { background: #e53935; color: #fff; }
.vp-us { background: var(--us); } .vp-ussr { background: var(--ussr); } .vp-even { background: #555; }
.turnpill { background: #3a4352; }
.phasing-US { box-shadow: inset 0 0 0 2px #6aa6ff; } .phasing-USSR { box-shadow: inset 0 0 0 2px #ff7a7a; }
#menuBtns { margin-left: auto; display: flex; gap: 4px; }
.icon-btn { background: var(--bg2); color: #fff; border: 1px solid #3f4a5a; border-radius: 8px; padding: 3px 8px; font-size: 12.5px; cursor: pointer; }
@media (max-width: 600px) { #status { font-size: 11.5px; } }
#ticker { font-size: 12.5px; padding: 5px 10px; background: #171c23; color: #d6dde6; min-height: 24px; border-bottom: 1px solid #2b333f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 지도 ---------- */
#mapwrap { position: relative; flex: 1 1 auto; min-height: 340px; overflow: auto; background: #2e4a5e; -webkit-overflow-scrolling: touch; }
#map { display: block; }
#zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
#zoom button { width: 38px; height: 38px; border-radius: 10px; border: 0; background: rgba(17,21,27,.85); color: #fff; font-size: 20px; cursor: pointer; }
.cty { cursor: pointer; }
.cty .box { fill: var(--paper); stroke: #50463a; stroke-width: 1.2; }
.cty.bg .box { stroke: #8a1c1c; stroke-width: 2.2; }
.cty .band { }
.cty .nm { font-size: 11.5px; font-weight: 800; fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.35); stroke-width: 2px; }
.cty .st { font-size: 12px; font-weight: 800; fill: #3b3326; }
.cty .num { font-size: 17px; font-weight: 900; }
.cty .valid { fill: none; stroke: #ffe14d; stroke-width: 4; opacity: 0; }
.cty.can .valid { opacity: 1; animation: glow 1.1s ease-in-out infinite; }
.cty.dim { opacity: .45; }
.cty.flash .box { animation: flash 1.4s ease-out; }
@keyframes glow { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .35; } }
@keyframes flash { 0% { fill: #fff59a; } 100% { fill: var(--paper); } }
.adj { stroke: rgba(255,255,255,.35); stroke-width: 1.6; }
.adj.sp-us { stroke: rgba(110,170,255,.7); stroke-dasharray: 5 4; }
.adj.sp-ussr { stroke: rgba(255,120,120,.7); stroke-dasharray: 5 4; }
.rlabel { font-size: 26px; font-weight: 900; fill: rgba(255,255,255,.16); letter-spacing: 4px; }
.sp text { font-weight: 900; fill: #fff; }

/* ---------- 하단 패널 ---------- */
#panel { flex: 0 0 auto; max-height: 45%; overflow-y: auto; background: #141920; border-top: 1px solid #333c49; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
#prompt { min-height: 30px; }
#prompt .ptitle { font-weight: 800; font-size: 15px; }
#prompt .pinfo { font-size: 12.5px; color: #b6c0cc; margin-top: 2px; }
#prompt .pbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pbtn { border: 0; border-radius: 9px; padding: 9px 12px; font-size: 14px; font-weight: 700; background: #3b4657; color: #fff; cursor: pointer; }
.pbtn.main { background: var(--gold); color: #2a1f00; }
.pbtn.warn { background: #6b3a3a; }
.waiting { color: #9fb0c3; font-size: 13.5px; }
.waiting::after { content: ' ⏳'; }
#handbar { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #9aa6b4; margin: 8px 2px 4px; }
#hand { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 6px; -webkit-overflow-scrolling: touch; }
.card { flex: 0 0 auto; width: 104px; min-height: 92px; border-radius: 10px; padding: 7px 7px 6px; position: relative; cursor: pointer; color: #fff; border: 2px solid transparent; display: flex; flex-direction: column; }
.card.US { background: linear-gradient(170deg, #2f72c4, #173f73); }
.card.USSR { background: linear-gradient(170deg, #c93a40, #7a171b); }
.card.BOTH { background: linear-gradient(170deg, #7a6aa8, #3f3566); }
.card.SC { background: linear-gradient(170deg, #e6c04f, #a07a12); color: #231a00; }
.card.CHINA { background: linear-gradient(170deg, #d8a630, #8e2a12); }
.card .ops { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.92); color: #111; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.card .cnum { position: absolute; top: 7px; right: 8px; font-size: 10px; opacity: .8; }
.card .cname { margin-top: 28px; font-size: 13px; font-weight: 800; line-height: 1.25; word-break: keep-all; }
.card .ctag { margin-top: auto; font-size: 10px; opacity: .85; }
.card.playable { border-color: var(--gold); box-shadow: 0 0 10px rgba(224,180,60,.55); }
.card.disabled { opacity: .45; }

/* ---------- 모달 ---------- */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #1b212a; width: 100%; max-width: 640px; max-height: 86vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid #3b4554; }
@media (min-width: 900px) { .modal { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0 0 8px; font-size: 18px; }
.sheet .close { float: right; background: none; border: 0; color: #aab4c0; font-size: 22px; cursor: pointer; }
.bigcard { border-radius: 14px; padding: 14px; margin-bottom: 12px; color: #fff; }
.bigcard.US { background: linear-gradient(170deg, #2f72c4, #173f73); }
.bigcard.USSR { background: linear-gradient(170deg, #c93a40, #7a171b); }
.bigcard.BOTH { background: linear-gradient(170deg, #7a6aa8, #3f3566); }
.bigcard.SC { background: linear-gradient(170deg, #e6c04f, #a07a12); color: #231a00; }
.bigcard.CHINA { background: linear-gradient(170deg, #d8a630, #8e2a12); }
.bigcard .bh { display: flex; align-items: center; gap: 10px; }
.bigcard .bops { width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #111; font-weight: 900; font-size: 20px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.bigcard .bname { font-size: 19px; font-weight: 900; }
.bigcard .bmeta { font-size: 12px; opacity: .85; margin-top: 2px; }
.bigcard .btext { margin-top: 10px; font-size: 14.5px; line-height: 1.55; }
.actbtns { display: flex; flex-direction: column; gap: 8px; }
.actbtns button { padding: 13px; font-size: 15px; font-weight: 800; border-radius: 11px; border: 0; cursor: pointer; background: #3b4657; color: #fff; text-align: left; }
.actbtns button.ev { background: #3e7d4f; }
.actbtns button.sp { background: #5a4a8a; }
.actbtns button.un { background: #2a6c8f; }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.cardgrid .card { width: auto; }
#logList { font-size: 13px; line-height: 1.5; }
#logList div { padding: 3px 0; border-bottom: 1px solid #262e39; }
.l-turn { color: var(--gold); font-weight: 800; }
.l-vp { color: #9fe0a8; } .l-defcon { color: #ffb36b; } .l-score { color: #ffe27a; font-weight: 700; }
.l-roll { color: #cfd8ff; } .l-event { color: #f0d4ff; } .l-space { color: #9fdcff; } .l-over { color: #fff; font-weight: 900; }
.rules h4 { margin: 14px 0 6px; color: var(--gold); }
.rules p, .rules li { font-size: 14px; line-height: 1.6; color: #dde3ea; }
.rules ul { padding-left: 20px; margin: 4px 0; }
.ctyinfo .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a323d; font-size: 14px; }
.over-win { font-size: 30px; font-weight: 900; text-align: center; margin: 10px 0; }

@media (min-width: 1000px) {
  #app { display: grid; grid-template-columns: 1fr 410px; grid-template-rows: auto auto minmax(0, 1fr); }
  #status, #ticker { grid-column: 1 / 3; }
  #mapwrap { grid-column: 1; grid-row: 3; min-height: 0; }
  #panel { grid-column: 2; grid-row: 3; max-height: none; overflow-y: auto; border-top: 0; border-left: 1px solid #333c49; }
  #hand { flex-wrap: wrap; overflow: visible; }
  .card { width: 118px; }
}
</style>
</head>

    }
  }
  degrade(n = 1, why) { this.setDefcon(this.G.defcon - n, why); }
  improve(n = 1, why) { this.setDefcon(this.G.defcon + n, why); }
  addMilops(s, n) { this.G.milops[s] = Math.min(5, this.G.milops[s] + n); }

  // ---------- 셋업 ----------
  newState() {
    const inf = {};
    for (const c of COUNTRY_IDS) inf[c] = { US: 0, USSR: 0 };
    const set = (s, obj) => { for (const k in obj) inf[k][s] += obj[k]; };
    set('USSR', { syria: 1, iraq: 1, nkorea: 3, egermany: 3, finland: 1 });
    set('US', { canada: 2, iran: 1, israel: 1, japan: 1, australia: 4, philippines: 1, skorea: 1, panama: 1, southafrica: 1, uk: 5 });
    return {
      turn: 1, ar: 0, phasing: 'USSR', defcon: 5, vp: 0,
      milops: { US: 0, USSR: 0 }, space: { US: 0, USSR: 0 }, spaceTries: { US: 0, USSR: 0 },
      inf, hands: { US: [], USSR: [] }, deck: [], discard: [], removed: [],
      china: { holder: 'USSR', faceUp: true },
      perm: {}, fx: {}, log: [], revealed: { US: false, USSR: false },
      headline: null, quagmire: false, bearTrap: false, over: null, phase: 'setup',
    };
  }
  cardsOfEra(era) {
    return Object.values(CARDS).filter(c => c.era === era && c.id !== 6 && (this.optional || c.id <= 103)).map(c => c.id);
  }
  async setup() {
    this.G = this.newState();
    this.G.deck = this.shuffle(this.cardsOfEra(1));
    this.log('게임 시작! 1945년, 냉전이 시작됩니다.', 'turn');
    this.deal();
    this.update();
    // 초기 영향력 배치
    this.G.phase = 'setup';
    this.G.phasing = 'USSR';
    this.log('소련: 동유럽에 영향력 6을 배치합니다.');
    await this.distribute('USSR', 'USSR', 6, {
      title: '초기 배치: 동유럽에 소련 영향력 6을 놓으세요', filter: c => inRegion(c, 'ee'), mustAll: true,
    });
    this.G.phasing = 'US';
    this.log('미국: 서유럽에 영향력 7을 배치합니다.');
    await this.distribute('US', 'US', 7, {
      title: '초기 배치: 서유럽에 미국 영향력 7을 놓으세요', filter: c => inRegion(c, 'we'), mustAll: true,
    });
  }

  // ---------- 카드 ----------
  draw() {
    if (!this.G.deck.length) {
      if (!this.G.discard.length) return null;
      this.G.deck = this.shuffle(this.G.discard.splice(0));
      this.log('덱이 떨어져 버림 더미를 섞어 새 덱을 만듭니다.');
    }
    return this.G.deck.pop();
  }
  handLimit() { return this.G.turn <= 3 ? 8 : 9; }
  deal() {
    const lim = this.handLimit();
    let progress = true;
    while (progress) {
      progress = false;
      for (const s of ['USSR', 'US']) {
        if (this.G.hands[s].length < lim) { const c = this.draw(); if (c != null) { this.G.hands[s].push(c); progress = true; } }
      }
    }
  }
  removeFromHand(s, id) { const h = this.G.hands[s]; const i = h.indexOf(id); if (i >= 0) h.splice(i, 1); return i >= 0; }
  discardCard(id) { if (id === 6) return; this.G.discard.push(id); }
  // 카드 사용 후 처리
  finishCard(id, eventFired) {
    if (id === 6) return;
    if (id === 49 && this.G.fx.envyKeep) { delete this.G.fx.envyKeep; return; }
    const card = CARDS[id];
    if (eventFired && card.perm && this.G.perm[id]) {
      if (card.star) this.G.removed.push(id);
      return; // 지속 효과로 테이블에 남음 (73 왕복외교는 perm 객체에 보관)
    }
    if (eventFired && card.star) this.G.removed.push(id);
    else this.G.discard.push(id);
  }
  passChina(from, faceUp) {
    this.G.china = { holder: opp(from), faceUp: !!faceUp };
    if (from === 'US' && this.G.perm[35]) { delete this.G.perm[35]; this.log('미국의 중국 카드 사용으로 「포모사 결의안」이 취소됩니다.'); }
  }

  // ---------- 작전값 ----------
  effOps(side, id) {
    let ops = CARDS[id].ops;
    if (id === 6) ops = 4;
    const fx = this.G.fx;
    if (side === 'US' && fx.containment) ops = Math.min(4, ops + 1);
    if (side === 'USSR' && fx.brezhnev) ops = Math.min(4, ops + 1);
    if (fx.redScare && fx.redScare[opp(side)]) ops = Math.max(1, ops - 1);
    return ops;
  }

  // ---------- 이벤트 조건 ----------
  eventOwner(id, player) { const s = CARDS[id].side; return s === 'BOTH' ? player : s; }
  canEvent(id, owner) {
    const G = this.G, P = G.perm;
    switch (id) {
      case 6: return false;
      case 7: return !P[83];
      case 13: return !P[65];
      case 21: return !!(P[16] || P[23]);
      case 32: return false; // UN 개입은 별도 처리
      case 55: return !P[96];
      case 56: return !P[110];
      case 59: return !P[97];
      case 61: return !P[86];
      case 101: return !!P[68];
      case 104: return this.era() < 3;
      case 49: return G.hands[opp(owner)].length > 0;
      default: return true;
    }
  }

  // ---------- 접근성/규칙 판정 ----------
  canPlaceSet(side) {
    const set = new Set();
    for (const c of COUNTRY_IDS) {
      if (this.inf(c, side) > 0) { set.add(c); for (const a of C[c].adj) set.add(a); }
      if (C[c].spAdj === side) set.add(c);
    }
    if (side === 'USSR' && this.G.fx.chernobyl) for (const c of [...set]) if (inRegion(c, this.G.fx.chernobyl)) set.delete(c);
    return set;
  }
  defconAllows(cid) {
    const d = this.G.defcon;
    if (inRegion(cid, 'eu')) return d >= 5;
    if (inRegion(cid, 'as')) return d >= 4;
    if (inRegion(cid, 'me')) return d >= 3;
    return true;
  }
  natoProtected(cid) {
    const P = this.G.perm;
    if (!P[21] || !inRegion(cid, 'eu') || this.control(cid) !== 'US') return false;
    if (cid === 'france' && P[17]) return false;
    if (cid === 'wgermany' && P[55]) return false;
    return true;
  }
  canAttack(side, cid, { coup, free } = {}) {
    if (this.inf(cid, opp(side)) <= 0) return false;
    if (!free && !this.defconAllows(cid)) return false;
    if (side === 'USSR') {
      if (this.natoProtected(cid)) return false;
      if (cid === 'japan' && this.G.perm[27]) return false;
      if (coup && this.G.perm[87] && inRegion(cid, 'eu')) return false;
    }
    return true;
  }

  // ---------- 득점 ----------
  regionStatus(r) {
    const list = r === 'eu' ? this.countriesIn('eu') : this.countriesIn(r);
    const res = {};
    for (const s of ['US', 'USSR']) {
      let n = 0, bg = 0, adj = 0;
      for (const c of list) {
        if (this.control(c) !== s) continue;
        n++;
        let isBg = C[c].bg;
        if (r === 'as' && c === 'taiwan' && s === 'US' && this.G.perm[35]) isBg = true;
        if (isBg) bg++;
        if (C[c].spAdj === opp(s)) adj++;
      }
      res[s] = { n, bg, adj };
    }
    if ((r === 'me' || r === 'as') && this.G.perm[73] && res.USSR.bg > 0) { res.USSR.bg--; res.USSR.n--; res.shuttle = true; }
    let totalBg = list.filter(c => C[c].bg).length;
    if (r === 'as' && this.G.perm[35] && this.control('taiwan') === 'US') totalBg++;
    for (const s of ['US', 'USSR']) {
      const me = res[s], o = res[opp(s)];
      let level = 0;
      if (me.n > 0) level = 1;
      if (me.n > o.n && me.bg > o.bg && me.bg > 0 && me.n > me.bg) level = 2;
      if (me.n > o.n && me.bg === totalBg && totalBg > 0) level = 3;
      me.level = level;
    }
    return res;
  }
  scoreValue(r) {
    const info = SCORING_INFO[r], st = this.regionStatus(r);
    const out = { US: 0, USSR: 0, win: null, st };
    for (const s of ['US', 'USSR']) {
      const me = st[s];
      let v = [0, info.presence, info.domination, info.control][me.level];
      if (v === 'WIN') { out.win = s; v = 0; }
      v += me.bg;
      if (info.adjBonus) v += me.adj;
      out[s] = v;
    }
    return out;
  }
  scoreRegion(r) {
    const res = this.scoreValue(r);
    const LV = ['없음', '존재', '우세', '지배'];
    this.log(`▶ ${SCORING_INFO[r].name} 득점 — 미국: ${LV[res.st.US.level]}(${res.US}점), 소련: ${LV[res.st.USSR.level]}(${res.USSR}점)`, 'score');
    if (res.st.shuttle) {
      this.log('「왕복 외교」로 소련 전장 국가 1개가 제외되었습니다.');
      delete this.G.perm[73]; this.G.discard.push(73);
    }
    if (res.win) throw new GameOver(res.win, `${SIDE_KO[res.win]}가 유럽을 지배했습니다`);
    const net = res.US - res.USSR;
    if (net > 0) this.vp('US', net, SCORING_INFO[r].name + ' 득점');
    else if (net < 0) this.vp('USSR', -net, SCORING_INFO[r].name + ' 득점');
    else this.log('득점 차이 없음');
  }
  scoreSEA() {
    const v = { US: 0, USSR: 0 };
    for (const c of this.countriesIn('sea')) { const k = this.control(c); if (k) v[k] += c === 'thailand' ? 2 : 1; }
    this.log(`▶ 동남아시아 득점 — 미국 ${v.US}점, 소련 ${v.USSR}점`, 'score');
    const net = v.US - v.USSR;
    if (net > 0) this.vp('US', net, '동남아시아 득점'); else if (net < 0) this.vp('USSR', -net, '동남아시아 득점');
  }

  // ---------- 우주 경쟁 ----------
  hasSpaceAbility(side, box) { return this.G.space[side] >= box && this.G.space[opp(side)] < box; }
  spaceMaxTries(side) { return this.hasSpaceAbility(side, 2) ? 2 : 1; }
  canSpace(side, id) {
    const box = this.G.space[side] + 1;
    if (box > 8) return false;
    if (this.G.spaceTries[side] >= this.spaceMaxTries(side)) return false;
    return this.effOps(side, id) >= SPACE_TRACK[box][1];
  }
  advanceSpace(side, n = 1, vpOnlyLast = false) {
    for (let k = 0; k < n; k++) {
      if (this.G.space[side] >= 8) return;
      const box = ++this.G.space[side];
      const [name, , , v1, v2, ab] = SPACE_TRACK[box];
      const first = this.G.space[opp(side)] < box;
      this.log(`🚀 ${SIDE_KO[side]} 우주 경쟁 ${box}칸: ${name}${ab ? ' — ' + ab : ''}`, 'space');
      if (!vpOnlyLast || k === n - 1) {
        const v = first ? v1 : v2;
        if (v) this.vp(side, v, name);
      }
    }
  }
  async spaceRace(side, id) {
    const box = this.G.space[side] + 1;
    const [name, , max] = SPACE_TRACK[box];
    this.G.spaceTries[side]++;
    const r = this.roll();
    this.log(`${SIDE_KO[side]}: ${cardName(id)} → 우주 경쟁 시도 → 「${name}」 (1~${max} 필요) 주사위 ${r}`, 'space');
    if (r <= max) this.advanceSpace(side, 1);
    else this.log('우주 경쟁 실패');
  }

  // ---------- 영향력 배치 공용 도우미 ----------
  // owner: 영향력의 주인, count: 개수, opts: {filter, maxPer, mustAll, title, distinct}
  async distribute(chooser, owner, count, opts = {}) {
    const placed = {};
    const snapshot = JSON.parse(JSON.stringify(this.G.inf));
    let left = count;
    while (left > 0) {
      const valid = COUNTRY_IDS.filter(c => (!opts.filter || opts.filter(c, placed)) &&
        (!opts.maxPer || (placed[c] || 0) < opts.maxPer));
      if (!valid.length) break;
      const ans = await this.ask(chooser, {
        type: 'country', title: opts.title || `${SIDE_KO[owner]} 영향력을 놓을 국가 선택`, info: `남은 수: ${left}`,
        valid, done: opts.mustAll ? null : '그만 놓기', reset: Object.keys(placed).length > 0,
        intent: { kind: 'add', side: owner },
      });
      if (ans === 'RESET') { this.G.inf = JSON.parse(JSON.stringify(snapshot)); for (const k in placed) delete placed[k]; left = count; this.update(); continue; }
      if (ans == null) break;
      this.addInf(ans, owner, 1); placed[ans] = (placed[ans] || 0) + 1; left--;
      this.update();
    }
    const summ = Object.entries(placed).map(([c, n]) => `${cname(c)}+${n}`).join(', ');
    if (summ) this.log(`${SIDE_KO[owner]} 영향력 배치: ${summ}`);
    return placed;
  }
  // target 진영 영향력 제거
  async removeSome(chooser, target, count, opts = {}) {
    const removed = {};
    let left = count;
    while (left > 0) {
      const valid = COUNTRY_IDS.filter(c => this.inf(c, target) > 0 && (!opts.filter || opts.filter(c, removed)) &&
        (!opts.maxPer || (removed[c] || 0) < opts.maxPer));
      if (!valid.length) break;
      const ans = await this.ask(chooser, {
        type: 'country', title: opts.title || `${SIDE_KO[target]} 영향력을 제거할 국가 선택`, info: `남은 수: ${left}`,
        valid, done: opts.optional ? '그만 제거' : null, intent: { kind: 'remove', side: target },
      });
      if (ans == null) break;
      this.removeInf(ans, target, 1); removed[ans] = (removed[ans] || 0) + 1; left--;
      this.update();
    }
    const summ = Object.entries(removed).map(([c, n]) => `${cname(c)}-${n}`).join(', ');
    if (summ) this.log(`${SIDE_KO[target]} 영향력 제거: ${summ}`);
    return removed;
  }
  async pickCountry(chooser, title, valid, intent, done) {
    if (!valid.length) return null;
    return this.ask(chooser, { type: 'country', title, valid, intent, done });
  }
  async pickOption(chooser, title, options, text) {
    if (options.length === 1) return options[0].value;
    return this.ask(chooser, { type: 'option', title, options, text });
  }

  // ---------- 작전 수행 ----------
  // ops: 기본 작전값, opts: {card, allowed, free, filter, title, noSpace}
  async conductOps(side, ops, opts = {}) {
    const card = opts.card;
    const asiaBonus = (card === 6 ? 1 : 0);
    const seaBonus = (side === 'USSR' && this.G.fx.vietnam) ? 1 : 0;
    const allowed = opts.allowed || ['inf', 'realign', 'coup'];
    const filter = opts.filter || (() => true);
    const modes = [];
    const placeSet = this.canPlaceSet(side);
    if (allowed.includes('inf') && [...placeSet].some(filter)) modes.push({ label: `영향력 배치 (작전 ${ops})`, value: 'inf', ai: 'inf' });
    const realignOk = COUNTRY_IDS.some(c => filter(c) && this.canAttack(side, c, { free: opts.free }) && !(card === 89 && false));
    if (allowed.includes('realign') && realignOk) modes.push({ label: '재정렬 굴림', value: 'realign' });
    const coupOk = COUNTRY_IDS.some(c => filter(c) && this.canAttack(side, c, { coup: true, free: opts.free }));
    if (allowed.includes('coup') && coupOk) modes.push({ label: '쿠데타', value: 'coup' });
    if (!modes.length) { this.log(`${SIDE_KO[side]}: 작전을 사용할 곳이 없습니다.`); return; }
    const mode = await this.pickOption(side, `작전 ${ops}${asiaBonus || seaBonus ? ' (+보너스 가능)' : ''} 사용 방법`, modes);
    this.G.opsCtx = { side, ops, card };
    if (mode === 'inf') await this.opsInfluence(side, ops, placeSet, filter, asiaBonus, seaBonus);
    else if (mode === 'realign') await this.opsRealign(side, ops, filter, asiaBonus, seaBonus, opts.free);
    else if (mode === 'coup') await this.opsCoup(side, ops, filter, asiaBonus, seaBonus, opts.free);
    this.G.opsCtx = null;
  }
  bonusFor(picks, asiaBonus, seaBonus) {
    let b = 0;
    if (asiaBonus && picks.every(c => inRegion(c, 'as'))) b += asiaBonus;
    if (seaBonus && picks.every(c => inRegion(c, 'sea'))) b += seaBonus;
    return b;
  }
  async opsInfluence(side, ops, placeSet, filter, asiaBonus, seaBonus) {
    const snapshot = JSON.parse(JSON.stringify(this.G.inf));
    let picks = [], spent = 0;
    const cost = c => (this.control(c) === opp(side) ? 2 : 1);
    while (true) {
      const valid = [...placeSet].filter(c => filter(c) && spent + cost(c) <= ops + this.bonusFor([...picks, c], asiaBonus, seaBonus));
      if (!valid.length) break;
      const budget = ops + this.bonusFor(picks, asiaBonus, seaBonus);
      const ans = await this.ask(side, {
        type: 'country', title: '영향력을 놓을 국가 선택', info: `사용 ${spent} / 작전 ${budget}${(asiaBonus || seaBonus) ? ' (아시아/동남아 전용 보너스 포함 가능)' : ''} · 상대 지배국은 2점`,
        valid, done: '작전 종료', reset: picks.length > 0, intent: { kind: 'add', side, ops: true },
      });
      if (ans === 'RESET') { this.G.inf = JSON.parse(JSON.stringify(snapshot)); picks = []; spent = 0; this.update(); continue; }
      if (ans == null) break;
      spent += cost(ans); this.addInf(ans, side, 1); picks.push(ans);
      this.update();
    }
    const cnt = {}; picks.forEach(c => cnt[c] = (cnt[c] || 0) + 1);
    this.log(`${SIDE_KO[side]} 영향력 배치: ${Object.entries(cnt).map(([c, n]) => cname(c) + '+' + n).join(', ') || '없음'}`);
  }
  realignMods(side, cid) {
    let m = 0;
    for (const a of C[cid].adj) if (this.control(a) === side) m++;
    if (this.inf(cid, side) > this.inf(cid, opp(side))) m++;
    if (C[cid].spAdj === side) m++;
    return m;
  }
  async realignRoll(side, cid) {
    let rS = this.roll(), rO = this.roll();
    const mS = this.realignMods(side, cid), mO = this.realignMods(opp(side), cid);
    let iranContra = (side === 'US' && this.G.fx.iranContra) ? -1 : (side === 'USSR' && this.G.fx.iranContra ? 0 : 0);
    let oIC = (opp(side) === 'US' && this.G.fx.iranContra) ? -1 : 0;
    const tS = rS + mS + iranContra, tO = rO + mO + oIC;
    let txt = `재정렬 ${cname(cid)}: ${SIDE_KO[side]} ${rS}+${mS + iranContra}=${tS} vs ${SIDE_KO[opp(side)]} ${rO}+${mO + oIC}=${tO}`;
    if (tS > tO) { const n = this.removeInf(cid, opp(side), tS - tO); txt += ` → ${SIDE_KO[opp(side)]} 영향력 -${n}`; }
    else if (tO > tS) { const n = this.removeInf(cid, side, tO - tS); txt += ` → ${SIDE_KO[side]} 영향력 -${n}`; }
    else txt += ' → 무승부';
    this.log(txt, 'roll');
    this.update();
  }
  async opsRealign(side, ops, filter, asiaBonus, seaBonus, free) {
    const picks = [];
    let spent = 0;
    while (true) {
      const valid = COUNTRY_IDS.filter(c => filter(c) && this.canAttack(side, c, { free }) && spent + 1 <= ops + this.bonusFor([...picks, c], asiaBonus, seaBonus));
      if (!valid.length) break;
      const ans = await this.ask(side, {
        type: 'country', title: '재정렬할 국가 선택', info: `남은 굴림: ${ops + this.bonusFor(picks, asiaBonus, seaBonus) - spent}`,
        valid, done: '재정렬 종료', intent: { kind: 'realign' },
      });
      if (ans == null) break;
      picks.push(ans); spent++;
      await this.realignRoll(side, ans);
      await this.pause(300);
    }
  }
  async opsCoup(side, ops, filter, asiaBonus, seaBonus, free) {
    const valid = COUNTRY_IDS.filter(c => filter(c) && this.canAttack(side, c, { coup: true, free }));
    const ans = await this.ask(side, { type: 'country', title: `쿠데타 대상 선택 (작전 ${ops})`, valid, intent: { kind: 'coup', ops, free } });
    if (ans == null) return;
    const total = ops + this.bonusFor([ans], asiaBonus, seaBonus);
    await this.coup(side, ans, total, { free });
  }
  coupMod(side, cid) {
    let m = 0;
    if (this.G.fx.salt) m -= 1;
    const ds = this.G.fx.deathSquads;
    if (ds && (inRegion(cid, 'ca') || inRegion(cid, 'sa'))) m += ds === side ? 1 : -1;
    return m;
  }
  async coup(side, cid, ops, { free } = {}) {
    if (this.G.fx.cmc && this.G.fx.cmc === opp(side)) {
      throw new GameOver(opp(side), `쿠바 미사일 위기 중 ${SIDE_KO[side]}가 쿠데타를 시도해 핵전쟁이 일어났습니다`);
    }

  if (!elig.length) return null;
  const ans = await g.ask(victim, { type: 'card', title, cards: elig, none: '버리지 않음', intent: { kind: 'discardToPrevent' } });
  if (ans == null) return null;
  g.removeFromHand(victim, ans); g.G.discard.push(ans);
  g.log(`${KO[victim]}이 ${cn(ans)}을(를) 버렸습니다.`);
  return ans;
}
async function freeCoupOrRealign(g, side, ops, filter, title) {
  const coupOk = EV_IDS.some(c => filter(c) && g.canAttack(side, c, { coup: true, free: true }));
  if (!coupOk) { g.log('무료 쿠데타/재정렬 대상이 없습니다.'); return; }
  await g.conductOps(side, ops, { allowed: ['realign', 'coup'], filter, free: true, title });
}

  bestOpsPlan(g, side, ops) {

    $('#bRem').onclick = () => openCardList('제거된 카드', G.removed);
    $('#bNew').onclick = () => {
      const m = openModal(`<h3>새 게임을 시작할까요?</h3><p style="color:#cfd6df">지금 게임 진행 상황은 지워집니다.</p><div class="actbtns"><button class="ev" id="yNew">새 게임 시작</button><button data-x>계속하기</button></div>`);
      m.querySelector('#yNew').onclick = () => { clearSave(); location.reload(); };
    };
  }
  function showRules() { openModal(`<button class="close" data-x>✕</button><h3>게임 규칙 요약</h3>${RULES_HTML}`); }

  // ---------- 에이전트 ----------
  let replay = [], record = [], saveMeta = null;
  const SAVE_KEY = 'twilight_ko_save_v1';
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...saveMeta, answers: record })); } catch (e) {} }
  function loadSave() { try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return v && v.answers ? v : null; } catch (e) { return null; } }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const replaying = () => replay.length > 0;
  class HumanAgent {
    ask(g, side, req) {
      if (replay.length) { const v = replay.shift(); record.push(v); if (!replay.length) { setTimeout(render, 0); } return Promise.resolve(v); }
      return new Promise(res0 => {
        const res = v => { record.push(v === undefined ? null : v); save(); res0(v); };
        pending = { req, res };
        render();
        if (req.type === 'card') openCardPick(req);
        if (req.type === 'country') setTimeout(() => ensureVisible(req.valid), 30);
        if (req.type === 'action' && navigator.vibrate) navigator.vibrate(30);
      });
    }
  }
  class SlowAI {
    constructor() { this.ai = new AIAgent(); }
    async ask(g, side, req) {
      if (!FAST && !replaying()) await sleep(req.type === 'action' ? 650 : 420);
      return this.ai.ask(g, side, req);
    }
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const FAST = location.search.includes('fast');

  // ---------- 시작 ----------
  ui.start = function (side, optional, restore) {
    human = side;
    const seed = restore ? restore.seed : (Math.random() * 2 ** 31) | 0;
    saveMeta = { seed, side, optional, at: Date.now() };
    replay = restore ? restore.answers.slice() : []; record = [];
    $('#title').classList.add('hidden');
    $('#app').classList.remove('hidden');
    const agents = { US: side === 'US' ? new HumanAgent() : new SlowAI(), USSR: side === 'USSR' ? new HumanAgent() : new SlowAI() };
    game = new Game({
      agents, optional, rng: mulberry32(seed),
      onUpdate: () => { if (!replaying()) render(); },
      onLog: (msg) => { if (!replaying()) $('#ticker').textContent = msg; },
      pause: ms => (FAST || replaying()) ? Promise.resolve() : sleep(ms),
    });
    if (!restore) save();
    buildMap();
    // 처음 화면 위치: 유럽 쪽으로 스크롤
    setTimeout(() => { const w = $('#mapwrap'); w.scrollLeft = (w.scrollWidth - w.clientWidth) * 0.3; w.scrollTop = 0; }, 50);
    game.run().then(over => {
      render();
      if (!over) return;
      clearSave();
      const win = over.winner === human;
      openModal(`<div class="over-win">${over.winner ? (win ? '🎉 승리!' : '패배…') : '무승부'}</div><p style="text-align:center;color:#cfd6df">${over.reason}<br>${over.winner ? KO[over.winner] + '이 냉전에서 승리했습니다.' : ''}</p><div class="actbtns"><button class="ev" id="ovAgain">새 게임</button><button id="ovLog">게임 기록 보기</button></div>`);
      $('#ovAgain').onclick = () => location.reload();
      $('#ovLog').onclick = showLog;
    }).catch(e => { console.error(e); $('#ticker').textContent = '오류: ' + e.message; });
  };
  ui.init = function () {
    let side = 'USSR';
    document.querySelectorAll('.side-btn').forEach(b => b.onclick = () => {
      document.querySelectorAll('.side-btn').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); side = b.dataset.side;
    });
    $('#startBtn').onclick = () => ui.start(side, $('#optCards').checked);
    const sv0 = loadSave();
    if (sv0 && sv0.answers.length) {
      const b = $('#resumeBtn'); b.classList.remove('hidden');
      const d = new Date(sv0.at || Date.now());
      b.innerHTML = `이어하기 <small style="font-weight:500;font-size:13px">(${KO[sv0.side]} · ${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')})</small>`;
      b.onclick = () => ui.start(sv0.side, sv0.optional, sv0);
    }
    $('#rulesBtn').onclick = showRules;
    $('#zin').onclick = () => { zoom = Math.min(2.5, zoom * 1.25); applyZoom(); };
    $('#zout').onclick = () => { zoom = Math.max(0.35, zoom / 1.25); applyZoom(); };
    window.addEventListener('resize', () => game && applyZoom());
  };
})();

const RULES_HTML = `<div class="rules">
<p>미국과 소련이 1945~1989년 냉전을 벌이는 2인 게임입니다. 카드를 내서 세계 각국에 <b>영향력</b>을 늘리고, 지역 득점으로 <b>승점(VP)</b>을 얻습니다.</p>
<h4>승리 조건</h4><ul>
<li>VP 20점에 먼저 도달하면 즉시 승리</li>
<li>유럽 득점 시 유럽을 <b>지배</b>하면 즉시 승리</li>
<li>상대 차례에 DEFCON이 1이 되면(핵전쟁) 그 차례의 플레이어가 패배</li>
<li>득점 카드를 손에 든 채 턴을 끝내면 패배</li>
<li>10턴 종료 후 최종 득점에서 VP가 앞선 쪽 승리</li></ul>
<h4>턴 진행</h4><ul>
<li>① DEFCON 1 회복 ② 카드 보충 (1~3턴 8장, 4턴부터 9장)</li>
<li>③ <b>헤드라인</b>: 양측이 1장씩 동시에 이벤트로 냄. 작전값이 높은 쪽 먼저(동률이면 미국)</li>
<li>④ <b>액션 라운드</b>: 1~3턴 6회, 4턴부터 7회. 소련 → 미국 순서로 카드 1장씩</li>
<li>⑤ 군사작전 점검 ⑥ 득점 카드 보유 검사 ⑦ 중국 카드 앞면으로</li>
<li>4턴에 중반 카드, 8턴에 후반 카드가 덱에 섞임</li></ul>
<h4>카드 사용 방법</h4><ul>
<li><b>이벤트</b>: 내 진영(또는 공통) 이벤트를 실행</li>
<li><b>작전</b>: 카드 숫자만큼 영향력 배치 / 재정렬 / 쿠데타 중 하나</li>
<li>상대 이벤트 카드를 작전으로 쓰면 <b>상대 이벤트도 발동</b>(순서는 내가 선택)</li>
<li><b>우주 경쟁</b>: 상대 이벤트를 발동시키지 않고 버리는 방법. 턴당 1회</li>
<li>*표 카드는 이벤트 사용 후 게임에서 제거</li></ul>
<h4>영향력 배치</h4><ul>
<li>내 영향력이 있는 국가, 그 인접 국가, 내 초강대국에 인접한 국가에만 배치</li>
<li>상대가 지배한 국가에 놓을 때는 1점당 작전 2</li>
<li><b>지배</b>: 내 영향력이 상대보다 안정도 이상 많을 때</li></ul>
<h4>쿠데타</h4><ul>
<li>주사위 + 작전값 − (안정도 × 2) = 결과. 양수면 그만큼 상대 영향력 제거, 남으면 내 영향력 추가</li>
<li>쿠데타한 작전값만큼 군사작전 트랙 증가</li>
<li><b>전장 국가(★)</b> 쿠데타는 DEFCON을 1 낮춤</li>
<li>DEFCON 4 이하: 유럽 금지 / 3 이하: 아시아 금지 / 2: 중동 금지</li></ul>
<h4>재정렬</h4><ul>
<li>작전 1점당 1회. 양측 주사위 + 보정(인접 지배국 +1씩, 영향력이 더 많으면 +1, 내 초강대국 인접 +1)</li>
<li>높은 쪽이 차이만큼 상대 영향력 제거</li></ul>
<h4>지역 득점</h4><ul>
<li><b>존재</b>: 1개국 이상 지배</li>
<li><b>우세</b>: 상대보다 지배국 수와 전장 국가 수가 모두 많고, 전장·비전장 국가를 각각 1개 이상 지배</li>
<li><b>지배</b>: 상대보다 지배국이 많고 그 지역 전장 국가를 모두 지배</li>
<li>추가: 지배한 전장 국가당 +1, 상대 초강대국에 인접한 지배국당 +1(유럽·아시아·중앙아메리카)</li></ul>
<h4>군사작전</h4><p>턴 종료 시 군사작전 값이 DEFCON보다 낮으면 부족한 만큼 상대가 VP를 얻습니다.</p>
<h4>중국 카드</h4><p>작전 4(아시아에 전부 쓰면 5). 사용하면 상대에게 뒷면으로 넘어가고 다음 턴에 사용 가능. 10턴 종료 시 보유자 +1 VP.</p>
<h4>지도 보는 법</h4><p>국가 칸 왼쪽 파란 숫자 = 미국 영향력, 오른쪽 빨간 숫자 = 소련 영향력, 가운데 = 안정도. 칸이 꽉 찬 색이면 그 나라가 지배 중. 빨간 띠와 ★ = 전장 국가. 오른쪽 위 점 = 초강대국 인접. 국가를 누르면 자세한 정보가 나옵니다.</p>
<p style="color:#8f9aa8;font-size:12px">원작: Twilight Struggle (GMT Games, Ananda Gupta & Jason Matthews). 이 페이지는 교육·개인 학습용 비공식 디지털 버전입니다.</p>
</div>`;

UI.init();
</script>
