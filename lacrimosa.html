<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라크리모사 – 모차르트의 후원자들</title>
<style>
:root{--paper:#f4ead6;--paper2:#ebdcbf;--ink:#3a2a1c;--wine:#7b1e2b;--gold:#b88a2e;--line:#c9b48d;--T:#222;--J:#b3261e;--C:#8a7a56;--ok:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;background:#2b1d16;color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px}
#app{max-width:820px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:150px}
header{position:sticky;top:0;z-index:20;background:var(--wine);color:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-family:Georgia,serif;font-style:italic;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header{flex-wrap:nowrap}
header .score{font-size:13px;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:12px}
button{font:inherit;border:1px solid var(--line);background:#fff8ea;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--wine);color:#fff;border-color:var(--wine)}
button.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
header button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35);padding:4px 9px}
section{padding:8px 10px;border-bottom:1px solid var(--line)}
h2{font-size:14px;margin:2px 0 6px;color:var(--wine);display:flex;align-items:center;gap:6px}
h2 small{color:#7a6a55;font-weight:normal;font-size:12px}
.hs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.card{flex:0 0 auto;width:104px;min-height:128px;border:1.5px solid var(--line);border-radius:8px;background:#fffdf6;padding:5px;font-size:11.5px;position:relative;display:flex;flex-direction:column;gap:3px}
.card.opus{background:#fbf3e3;border-color:#d4b57a}
.card .per{position:absolute;right:4px;top:3px;font-size:10px;color:#9a8566;font-family:Georgia,serif}
.card .ttl{font-weight:bold;font-size:11.5px;line-height:1.2;padding-right:14px}
.card .sub{font-size:10px;color:#7a6a55}
.card .zone{border-top:1px dashed #dccaa5;padding-top:2px}
.card .lbl{font-size:9.5px;color:#9a8566}
.card>.lbl:first-of-type{padding-right:18px}
.card.sel{outline:3px solid var(--gold);outline-offset:1px}
.card.can{box-shadow:0 0 0 3px #4caf7a;cursor:pointer}
.card.rot{opacity:.55}
.card.empty{background:transparent;border-style:dashed;color:#a8957a;align-items:center;justify-content:center}
.slotcost{font-size:10.5px;text-align:center;margin-top:2px;min-height:15px}
.chip{display:inline-flex;align-items:center;gap:1px;border-radius:9px;padding:0 5px;margin:1px;font-size:11px;line-height:17px;background:#efe3c8;white-space:nowrap}
.chip.T{background:var(--T);color:#fff}.chip.J{background:var(--J);color:#fff}.chip.C{background:#fff;border:1px solid var(--C);color:#5a4c30}.chip.W{background:linear-gradient(90deg,#222 0 33%,#b3261e 33% 66%,#d8cfb8 66%);color:#fff;text-shadow:0 0 2px #000}
.chip.tok{border-radius:3px;outline:1px solid #0003}
.chip.d{background:#f3d77a}.chip.vp{background:var(--wine);color:#fff}.chip.fin{background:#c99a6b;color:#fff}
.chip.cost{opacity:.95}.chip.cost::before{content:"−";font-weight:bold}
.act{display:inline-block;background:#fff;border:1px solid #cdb68a;border-radius:6px;padding:0 4px;margin:1px;font-size:11px}
.row7 .card{width:96px}
#map svg{width:100%;height:auto;background:#e8dcbd;border-radius:8px;display:block}
.loc{cursor:default}.loc.can{cursor:pointer}
.req{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mv{border:1px solid var(--line);border-radius:6px;padding:3px;background:#fffaf0;font-size:11px}
.mv h4{margin:0 0 3px;font-size:11.5px;text-align:center;color:var(--wine)}
.mv .vpv{text-align:center;font-size:10.5px;color:#7a6a55}
.slot{display:flex;align-items:center;justify-content:space-between;border:1px solid #e2d3b3;border-radius:5px;padding:1px 3px;margin:2px 0;min-height:22px;background:#fff}
.slot.X{background:#ddd;color:#999}.slot.P{background:#e9d1d5}.slot.S{background:#d6e3ef}.slot.N{background:#ece6d6}
.slot.can{box-shadow:0 0 0 2px #4caf7a;cursor:pointer}
.ctile{font-size:10px;border-top:1px dashed #d8c7a3;margin-top:3px;padding-top:2px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fffaf0}
.trk{display:flex;align-items:center;gap:4px;margin:3px 0}
.trk .nm{width:34px;font-size:12px}
.trk .cells{display:flex;gap:2px}
.trk .cell{width:14px;height:14px;border-radius:3px;background:#eadfc6;font-size:9px;text-align:center;line-height:14px;color:#998}
.trk .cell.on{background:var(--wine);color:#fff}
.fin{display:flex;flex-direction:column-reverse;gap:2px}
.fin div{font-size:11px;padding:1px 4px;border-radius:4px;background:#f1e6cf}
.fin div.on{background:var(--wine);color:#fff}
.mk{display:inline-block;margin:2px;padding:1px 5px;border-radius:6px;font-size:11px;border:1px solid #d3bf95;background:#fff}
.mk.used{opacity:.35;text-decoration:line-through}
.pb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pb .card{width:auto;min-height:96px}
#prompt{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
#prompt .in{pointer-events:auto;max-width:820px;width:100%;background:#3a2a1c;color:#fff;padding:9px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px #0006}
#prompt .msg{font-size:13.5px;margin-bottom:6px;line-height:1.4}
#prompt .btns{display:flex;flex-wrap:wrap;gap:6px}
#prompt button{background:#fff8ea}
#prompt button.pri{background:var(--gold);border-color:var(--gold);color:#fff}
#log{font-size:12px;max-height:200px;overflow:auto;background:#fffaf0;border:1px solid var(--line);border-radius:6px;padding:6px}
#log div{padding:1px 0;border-bottom:1px dotted #e6d8bb}
#log .s{color:#1f4f7a}#log .m{color:var(--wine);font-weight:bold}
.solo{background:#eef3f8}
.overlay{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.overlay .pan{background:var(--paper);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.overlay h3{margin:0 0 8px;color:var(--wine)}
table.sc{width:100%;border-collapse:collapse;font-size:13px}table.sc td,table.sc th{border-bottom:1px solid var(--line);padding:4px;text-align:center}
.opt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.opt button.on{background:var(--wine);color:#fff}
.note{font-size:12px;color:#6d5b45;line-height:1.5}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#1f4f7a;color:#fff;padding:8px 12px;border-radius:10px;z-index:40;font-size:13px;max-width:92%;box-shadow:0 4px 12px #0005}
.exch{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.exch button{padding:2px 6px;font-size:11px}
@media(max-width:560px){.req{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:1fr}}
</style>
</head>

 else if(a==='P'){const i=rowPick('opus',sc.L);if(i<0){log('  작품 카드가 없어 아무것도 하지 않음','s');return;}const c=CARDS[G.row[i]];G.row[i]=null;slideRow();const v0=S.vp;S.vp+=Math.max(0,c.sell.vp-DIFF[G.diff].pen);addFin(c.sell.fin,S);log(`  📜 『${c.name}』 판매 ★${S.vp-v0}`,'s');}

 p.opus.forEach(o=>o.rot=false);
 p.deck=shuffle(p.exp.concat(p.story));p.exp=[];p.story=[];
 G.S.deck=shuffle(DIFF[G.diff].cards.slice());G.S.exp=[];G.S.story=[];
 if(G.round>=5){p.cnt.T+=G.wild.t+G.wild.c;G.wild={t:0,c:0};finalScore();return;}
 for(let l=1;l<=11;l++){const L=G.map.loc[l];if(L.tile)L.gild=true;}refillMap();
 for(let i=3;i<7;i++)G.row[i]=null;while(G.deck.length&&G.deck[0][0]!=='B')G.deck.shift();

function courtBest(courts,opus,marks){
 const used={o:new Set(),m:new Set()};let best=0,bestSel=[];
 function need(g){if(g.k==='types')return g.l.map(t=>({src:'o',f:o=>CARDS[o.id].type===t}));if(g.k==='periods')return g.l.map(p=>({src:'o',f:o=>CARDS[o.id].p===p}));
  if(g.k==='instr')return g.l.map(x=>({src:'m',f:m=>m.inst===x}));return g.l.map(x=>({src:'m',f:m=>m.mv===x}));}
 function sat(reqs,k,cb){if(k===reqs.length)return cb();const r=reqs[k];const list=r.src==='o'?opus:marks;
  for(let i=0;i<list.length;i++){if(used[r.src].has(i)||!r.f(list[i]))continue;used[r.src].add(i);const ok=sat(reqs,k+1,cb);used[r.src].delete(i);if(ok==='stop')return 'stop';}}
 function go(ci,tot,sel){if(tot>best){best=tot;bestSel=sel.slice();}if(ci===courts.length)return;const c=TILE[courts[ci]];
  sat(need(c.g),0,()=>{go(ci+1,tot+c.vp,sel.concat(c.id));});go(ci+1,tot,sel);}
 go(0,0,[]);return{vp:best,sel:bestSel};}
function requiemScore(){let p=0,s=0;for(let m=1;m<=5;m++){const sl=G.req.filter(x=>x.mv===m);const a=sl.filter(x=>x.own==='P'||x.own==='N').length,b=sl.filter(x=>x.own==='S').length;
 const pv=a>b?REQ[m].hi:REQ[m].lo,sv=b>a?REQ[m].hi:REQ[m].lo;p+=sl.filter(x=>x.own==='P').length*pv;s+=sl.filter(x=>x.own==='S').length*sv;}return{p,s};}
function finalScore(){const p=P(),S=G.S;
 const marks=G.req.filter(x=>x.own==='P');const cb=courtBest(p.courts,p.opus,marks);const rq=requiemScore();
 const sp=p.tr.T+p.tr.J+p.tr.C+p.cnt.T+p.cnt.J+p.cnt.C;
 const pr={game:p.vp,court:cb.vp,req:rq.p,story:Math.floor(sp/2),money:Math.floor(p.d/3)};pr.total=Object.values(pr).reduce((a,b)=>a+b,0);
 const sc=S.courts.reduce((a,id)=>a+TILE[id].vp,0);const sr={game:S.vp,court:sc,req:rq.s,story:0,money:0};sr.total=Object.values(sr).reduce((a,b)=>a+b,0);
 let win=pr.total>sr.total?'P':pr.total<sr.total?'S':null;
 if(!win){const a=marks.length,b=G.req.filter(x=>x.own==='S').length;win=a>b?'P':a<b?'S':'T';}
 G.final={pr,sr,win,courtSel:cb.sel};G.over=true;G.phase='over';
 log(`게임 종료! 나 ${pr.total}점 : 쉬카네더 ${sr.total}점`,'m');}

 if(r.d)h+=`<span class="chip d${cl}">🪙${r.d}</span>`;if(r.gain)h+=`<span class="chip d">🪙+${r.gain}</span>`;
 if(r.vp)h+=`<span class="chip vp${cl}">★${r.vp}</span>`;if(r.fin)h+=`<span class="chip fin${cl}">재정${cost?'':'+'}${r.fin}</span>`;
 for(const k of ['T','J','C','W'])if(r[k])h+=`<span class="chip ${k}${cl}">${SP[k]}${cost?'':'▲'}${r[k]}</span>`;
 for(const k of ['T','J','C','W'])if(r['c'+k])h+=`<span class="chip ${k} tok">${SP[k]}●${r['c'+k]}</span>`;
 if(r.act)h+=`<span class="act">${ACT[r.act].i}${ACT[r.act].k}</span>`;
 if(r.per)h+=`<span class="chip">${TYPEI[r.per[0]]}${TYPE[r.per[0]]}당 ★${r.per[1]}</span>`;
 if(r.neutral)h+=`<span class="chip">중립 마커</span>`;return h;}
function plain(r){if(!r)return'';const a=[];if(r.d)a.push('🪙'+r.d);if(r.vp)a.push('★'+r.vp);if(r.fin)a.push('재정+'+r.fin);
 for(const k of ['T','J','C','W'])if(r[k])a.push(SP[k]+'▲'+r[k]);for(const k of ['T','J','C','W'])if(r['c'+k])a.push(SP[k]+'토큰'+r['c'+k]);
 if(r.act)a.push(ACT[r.act].k);if(r.per)a.push(`${TYPE[r.per[0]]}당★${r.per[1]}`);return a.join(' ');}

function goalText(g){if(g.k==='types')return g.l.map(t=>TYPEI[t]+TYPE[t]).join('+')+' 작품';if(g.k==='periods')return g.l.map(p=>'제'+ROMAN[p]+'시대').join('+')+' 작품';
 if(g.k==='instr')return g.l.map(x=>INST[x].i+INST[x].k).join('+')+' 파트';return g.l.map(m=>REQ[m].k).join('+')+' 악장';}

function canTarget(kind,i){const s=ui.sel;if(!s)return false;const t=G.turn.pending[s.pi]&&G.turn.pending[s.pi].type;
 if(kind==='row'){const id=G.row[i];if(!id)return false;
  if(t==='D')return CARDS[id].kind==='mem'&&canPay(MEM_SPACE[i]);if(t==='O')return CARDS[id].kind==='opus'&&canPay(opusCost(i));return false;}
 if(kind==='opus'){const o=P().opus[i],c=CARDS[o.id];if(!['P','PR','SR'].includes(t))return false;if((t==='PR'||t==='SR')&&c.type!=='religious')return false;
  const cp=!o.rot&&spHave('T')>=c.perf.T&&t!=='SR',cs=spHave('T')>=c.sell.T&&t!=='PR';return cp||cs;}
 if(kind==='loc'){if(t!=='V')return false;const L=G.map.loc[i];if(!L.tile)return false;const tc=TILE[L.tile].cost;const rc=roadCost(i);return canPay({d:rc+(tc.d||0),T:tc.T,J:tc.J,C:tc.C});}
 if(kind==='slot'){const sl=G.req[i];if(sl.own)return false;
  if(t==='N')return sl.mv===G.turn.pending[s.pi].mv;
  if(t!=='R')return false;if(!G.stacks[sl.mv].length)return false;
  return Object.keys(MYMK).some(k=>P().mk[k]&&MYMK[k].inst===sl.inst&&reqCheck(i,k));}
 return false;}

  if(ui.sel.keys){msg='어느 호른 마커를 쓸까요? (빈 칸의 보상이 다릅니다)';ui.sel.keys.forEach(k=>B(`${MYMK[k].k}: ${plain(MYMK[k].rw)||'중립 마커 추가'}`,()=>doRequiem(ui.sel.pi,ui.sel.si,k)));}
  else if(ui.sel.oi!=null){const o=P().opus[ui.sel.oi],c=CARDS[o.id];msg=`『${c.name}』을(를) 어떻게 할까요?`;
   if(t!=='SR')B(`공연: 재능${c.perf.T} → 🪙${c.perf.d+(t==='PR'?7:0)}`,()=>doPerform(ui.sel.pi,ui.sel.oi,'perf'),'pri',o.rot||spHave('T')<c.perf.T);
   if(t!=='PR')B(`판매: 재능${c.sell.T} → ★${c.sell.vp}, 재정+${c.sell.fin+(t==='SR'?2:0)}`,()=>doPerform(ui.sel.pi,ui.sel.oi,'sell'),'pri',spHave('T')<c.sell.T);}
  else msg={D:'카드 줄에서 기억 카드를 고르세요 (초록 테두리 = 지불 가능). 이번 턴 이야기 칸 카드와 교체됩니다.',O:'카드 줄에서 작품 카드를 고르세요 (카드 비용 + 칸 추가 비용).',P:'나의 작품에서 공연 또는 판매할 작품을 고르세요.',PR:'공연할 종교음악 작품을 고르세요.',SR:'판매할 종교음악 작품을 고르세요.',V:'지도에서 목적지를 고르세요 (길 비용 🪙 + 타일 비용).',R:'레퀴엠에서 빈 파트를 고르세요 (내 마커와 악기가 같아야 함).',N:'같은 악장의 빈 칸에 중립 마커를 놓으세요 (♪ 쪽으로 계산됨).'}[t];
  if(!(it.type==='N'))B('취소',()=>{ui.sel=null;render();});}
 else if(G.phase==='place'){const ph=G.turn.exp?'이야기':G.turn.story?'경험':null;
  if(ui.pick){msg='이 카드를 어디에 놓을까요?';if(!G.turn.exp)B('⬆ 경험 칸 (행동)',()=>placeCard(ui.pick,'exp'),'pri');if(!G.turn.story)B('⬇ 이야기 칸 (점수)',()=>placeCard(ui.pick,'story'),'pri');B('취소',()=>{ui.pick=null;render();});}
  else msg=ph?`손패에서 ${ph} 칸에 놓을 카드를 누르세요.`:'손패에서 카드를 눌러 경험 칸 1장, 이야기 칸 1장을 놓으세요.';}
 else if(G.phase==='choose'){const c=CARDS[G.turn.exp];msg='경험 칸 카드를 어떻게 쓸까요?';
  B(`카드 효과: ${plain(c.rw)?plain(c.rw)+' + ':''}${c.acts.split('').map(a=>ACT[a].k).join('·')}`,()=>chooseUse(true),'pri');B(`대신 🪙${G.round} 받기`,()=>chooseUse(false));}
 else if(G.phase==='act'){const pd=G.turn.pending;msg=pd.length?'할 행동을 고르세요. 남은 행동은 건너뛸 수 있어요.':'행동을 모두 마쳤어요. 턴을 끝내면 카드가 공개되어 무를 수 없어요.';
  pd.forEach((it,i)=>{if(it.type==='N'){const has=G.req.some(s=>s.mv===it.mv&&!s.own);if(!has){B('중립 마커: 빈 칸 없음(넘기기)',()=>skipNeutral(i));return;}}
   B(`${ACT[it.type].i} ${ACT[it.type].k}${it.extra?' (추가)':''}`,()=>{ui.sel={pi:i};render();},'pri');});
  B('턴 종료 ▶',endTurn,'gold',pd.some(x=>x.forced));}
 el.innerHTML=`<div class="in"><div class="msg">${msg}</div><div class="btns"></div></div>`;
 const bx=el.querySelector('.btns');b.forEach(x=>{const e=document.createElement('button');e.innerHTML=x.t;if(x.cls)e.className=x.cls;e.disabled=!!x.dis;e.onclick=x.f;bx.appendChild(e);});}
function showSoloToast(){if(!G.lastSolo||G.over)return;const t=document.createElement('div');t.className='toast';
 t.innerHTML=`🎭 쉬카네더: ${G.lastSolo.lines.slice(1).map(x=>x.trim()).join(' / ')||'행동 없음'}`;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

 ov(`<h3>${f.win==='P'?'🎉 당신이 콘스탄체의 회고록 최고 후원자!':f.win==='S'?'쉬카네더의 승리':'공동 승리'}</h3>
 <table class="sc"><tr><th></th><th>나</th><th>쉬카네더</th></tr>${r('게임 중 점수','game')}${r('궁정 타일','court')}${r('레퀴엠','req')}${r('남은 이야기 점수(2당 1)','story')}${r('남은 두캇(3당 1)','money')}<tr><th>합계</th><th>${f.pr.total}</th><th>${f.sr.total}</th></tr></table>
 <p class="note">달성한 궁정: ${f.courtSel.map(id=>goalText(TILE[id].g)).join(', ')||'없음'}</p><button class="pri" onclick="ov('')">닫기</button>`);}
function ov(html){document.getElementById('ov').innerHTML=html?`<div class="overlay"><div class="pan">${html}</div></div>`:'';}
function menu(){ov(`<h3>메뉴</h3><div class="opt"><button onclick="ov('');rules()">규칙 요약</button><button onclick="if(confirm('지금 게임을 버리고 새로 시작할까요?')){G=null;localStorage.removeItem(SAVE);ov('');render();}">새 게임</button><button onclick="ov('')">닫기</button></div>`);}
function rules(){ov(`<h3>규칙 요약</h3><div class="note">
<b>목표</b> 5시대 동안 모차르트의 후원자로서 승점(★)을 모아 쉬카네더(솔로이스트)보다 높은 점수를 얻으세요.<br><br>

<b>행동</b> 📖회고록 기록(카드 줄의 기억 카드로 덱 강화) · ✒️작품 위촉(작품 카드 구매, 즉시 ★) · 🎭공연(두캇, 시대당 1번)/판매(★·재정, 카드 제거) · 🐎여행(도시 보상/궁정 타일) · ✝️레퀴엠(작곡가 고용, 마커 배치)<br><br>
<b>이야기 점수</b> 재능·여행·작곡 세 종류. 트랙(시대마다 0으로 초기화)과 토큰(계속 유지)을 합쳐 씁니다. 두캇 3 → 토큰 1, 토큰 1 → 두캇 1 교환 가능.<br><br>
<b>시대 정리</b> 이야기 칸 카드 점수, 재정 수입, 시대 보너스(경험 칸 행동 아이콘 수만큼)를 받고, 카드 줄 오른쪽 4장이 버려지며 다음 시대 카드가 나옵니다. 남은 궁정·도시 타일은 금테(더 좋은) 면으로 뒤집혀요.<br><br>
<b>게임 끝</b> 궁정 목표(작품·파트 하나는 한 궁정에만 사용), 레퀴엠 악장별 다수(♪ vs ♬, 동점이면 둘 다 낮은 점수), 남은 이야기 점수 2당 1★, 두캇 3당 1★.<br><br>
<b>쉬카네더</b> 비용을 내지 않고 카드에 적힌 대로 행동합니다. 판매만 하고, 궁정 타일은 목표 달성과 상관없이 모두 득점합니다.<br><br>
<b>무르기</b> 내 턴 안의 선택은 얼마든지 되돌릴 수 있어요. 하지만 턴을 끝내는 순간 카드 뽑기·카드 줄 보충·쉬카네더 카드처럼 숨겨진 정보가 공개되므로 그 이전으로는 무를 수 없습니다. (이 게임엔 주사위가 없고, 무작위 요소는 모두 카드 섞기·뽑기입니다.)<br><br>
<b>안내</b> 규칙서에는 개별 카드·타일의 수치가 실려 있지 않아, 카드 내용(비용·보상·궁정 목표·쉬카네더 카드 등)은 규칙에 맞게 새로 설계한 값입니다. 실물 게임과 수치가 다를 수 있어요.</div>
<button class="pri" onclick="ov('')">닫기</button>`);}
function startScreen(){let diff='mid',comp='Eybler';
 const draw=()=>{document.getElementById('app').innerHTML=`<header><h1>Lacrimosa · 라크리모사</h1></header><section>
 <p class="note">1791년 12월, 모차르트는 레퀴엠의 '라크리모사' 여덟 마디를 남기고 세상을 떠났습니다. 미망인 콘스탄체가 남편의 후원자들을 만나 이야기를 듣고, 레퀴엠 완성을 도울 작곡가를 고용합니다. 당신은 후원자, 상대는 극작가 쉬카네더입니다.</p>
 <h2>난이도</h2><div class="opt">${Object.keys(DIFF).map(k=>`<button data-d="${k}" class="${diff===k?'on':''}">${DIFF[k].k}</button>`).join('')}</div>
 <h2>레퀴엠 작곡가</h2><div class="opt">${Object.keys(COMP).map(k=>`<button data-c="${k}" class="${comp===k?'on':''}">${COMP[k].k}</button>`).join('')}<button data-c="rand">무작위</button></div>
 <p class="note">${comp!=='rand'?`${COMP[comp].k}: 오페르토리움 보너스 ${COMP[comp].off.map(t=>TYPE[t]).join('/')}, 아뉴스 데이 추가 행동 ${COMP[comp].ag.map(a=>ACT[a].k).join('/')}`:''}</p>
 <button class="pri" id="go" style="font-size:16px;padding:10px 22px">게임 시작</button> <button id="rl">규칙 요약</button></section>`;
 document.getElementById('prompt').innerHTML='';
 document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{diff=e.dataset.d;draw();});

 document.getElementById('go').onclick=()=>newGame(diff,comp);document.getElementById('rl').onclick=rules;};draw();}
