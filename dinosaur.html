.exit.circ{box-shadow:0 0 0 3px #fff,0 0 0 6px #2f9e6e}
.legend{font-size:11px;color:var(--mut);margin-top:34px;margin-left:-22px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}.legend .lg{display:inline-block;width:11px;height:11px;border-radius:2px;margin-left:5px}

.anytime{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.mini-b{font-size:11px;border:1px solid #b88a2a;background:#fff2cc;border-radius:6px;padding:3px 7px}
.secnum{margin-bottom:4px}.warnb{background:var(--red);color:#fff;border-radius:8px;padding:1px 7px;font-weight:800;font-size:12px}.okb{background:var(--green);color:#fff;border-radius:8px;padding:1px 7px;font-size:12px}

.dtrack{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.dc{height:22px;border:1px solid #e3b7b0;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#b9a59f}
.dc.dis{background:#ffd8d2;color:var(--red);font-weight:900}.dc.law{opacity:.5}.dc.on{background:#7a1f15;color:#fff}.dc.on.dis{background:#c0221a}
.sheet2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin-top:8px}
.ttrack{display:grid;grid-template-columns:repeat(10,1fr) 34px;gap:2px}.tc{height:22px;border-radius:3px;background:#fff;border:1px solid #cde4cf;font-size:10px;color:#9bb89f;display:flex;align-items:center;justify-content:center}
.tc.ic{background:#d6efd9}.tc.on{background:#4caf6e;color:#fff;border-color:#2e7d4a}.tc.on .dna,.tc.on .ic{filter:drop-shadow(0 0 1px #fff)}
.tvp{font-size:11px;font-weight:800;color:#b9a3e2;display:flex;align-items:center}.tvp.on{color:#6a3fc2}
.dinos{display:flex;flex-direction:column;gap:6px}.dth{font-weight:800;font-size:12px;padding:2px 6px;border-radius:5px}.dth small{font-weight:400}
.dth.herb{background:#9fd8a3}.dth.small{background:#c5a7ea}.dth.large{background:#f8b47f}
.spr{display:flex;align-items:center;gap:4px;font-size:12px;padding:1px 4px}.snm{flex:1;min-width:0}
.dbx{display:inline-flex;gap:2px;margin-left:4px}.dbx i{width:12px;height:12px;border:1.5px solid #888;border-radius:3px;background:#fff}.dbx i.al{background:#333}.dbx i.dd{background:repeating-linear-gradient(45deg,#c33,#c33 2px,#fff 2px,#fff 4px)}

.row{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}

<body>
<div id="top"></div>
<div id="main">
  <div class="panel" id="board"></div>
  <div class="panel" id="sheet"></div>
  <div id="side"><div class="panel" id="prompt"></div><div class="panel" id="log"></div></div>
</div>
<div id="flash"></div>
<div id="modal"></div>
<script>
'use strict';
/* ===================== 상수 / 데이터 ===================== */
const N = 16;
const DIRS = { N: [-1, 0], E: [0, 1], S: [1, 0], W: [0, -1] };
const OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
const DLIST = ['N', 'E', 'S', 'W'];

function payCoin(p, key) {

  return true;
}

    front({ t: 'eff', p: p.idx, eff: SPECS[id].bonus, src: SPECS[id].name });
  } else {
    p.built[key] = true; log(`${p.name}: 건물 「${BLDS[id].name}」 완성! 보너스: ${BLDS[id].bt}`, p.idx);
    front({ t: 'placeCard', p: p.idx, id }, { t: 'eff', p: p.idx, eff: BLDS[id].bonus.map(op => op.sp === 'attachThrill' ? { sp: 'attachThrill', id } : op), src: BLDS[id].name });

}

function mapMode() {
  const t = head(); const me = ME();
  if (!t || t.p !== me.idx || me.ai || ui.view !== me.idx) return null;
  if (t.t === 'roads') return { kind: 'road' };
  if (t.t === 'destroyRoads') return { kind: 'destroyRoad' };
  if (t.t === 'attr') { const k = t.k === 'A' ? ui.attrKind : t.k; return k ? { kind: 'shape', shape: ATTR[k].shape, attach: null } : null; }
  if (t.t === 'paddock') return { kind: 'shape', shape: paddockShape(t.sp), attach: null };
  if (t.t === 'placeCard') return { kind: 'shape', shape: BLDS[t.id].shape, attach: BLDS[t.id].attach };
  if (t.t === 'special' && t.sp === 'architect') return { kind: 'pickBld', filter: b => b.kind === 'attr' };
  if (t.t === 'disasterPick') return { kind: 'pickBld', filter: b => t.kind === 'pad' ? b.kind === 'pad' : b.kind === 'attr' };
  return null;
}
function curCells(mm, r, c) {
  const os = orientations(mm.shape); const o = os[ui.orient % os.length];
  const h = Math.max(...o.map(x => x[0])), w = Math.max(...o.map(x => x[1]));
  const r0 = r - Math.floor(h / 2), c0 = c - Math.floor(w / 2);
  return o.map(([a, b]) => [a + r0, b + c0]);
}
function autoShape(p, r, c) {
  const want = [];
  for (const d of DLIST) {
    const [dr, dc] = DIRS[d]; const rr = r + dr, cc = c + dc;
    if (!inB(rr, cc)) { if (exitAt(r, c, d)) want.push(d); continue; }
    const g = cell(p, rr, cc);
    if (g.b >= 0) want.push(d);
    else if (g.rd && g.rd.includes(OPP[d])) want.unshift(d);
  }
  const uniq = [...new Set(want)];
  if (uniq.length >= 2) return shapeOf(uniq[0], uniq[1]);

}

/* ---------- 렌더 ---------- */
function render() {
  const t = head();
  const key = t ? JSON.stringify([t.t, t.p, t.k, t.sp, t.id]) : '';
  const changed = key !== ui.lastHead;
  if (changed) { ui.lastHead = key; ui.orient = 0; ui.attrKind = null; ui.plan = {}; ui.spend = {}; ui.tourHover = null; if (!(t && t.t === 'placeDie')) ui.selDie = null; ui.touchArm = false; }
  const me = ME();
  if (ui.selDie != null && ui.selDie >= me.dice.length) ui.selDie = null;
  // 내 차례 작업이면 내 시트 보기로 전환
  if (t && t.p === me.idx && mapMode() === null && ['roads', 'attr', 'paddock', 'placeCard'].includes(t.t)) ui.view = me.idx;
  renderTop(); renderBoard(); renderSheet(); renderPrompt(); renderLog();
  save();
  if (changed && window.innerWidth <= 980 && t && t.p === me.idx) {
    const mapTasks = ['roads', 'attr', 'paddock', 'placeCard', 'destroyRoads', 'disasterPick', 'tour'];
    const tgt = mapTasks.includes(t.t) || (t.t === 'special' && t.sp === 'architect') ? document.getElementById('livemap') : ['draft', 'placeDie'].includes(t.t) ? document.getElementById('board') : null;
    if (tgt) setTimeout(() => tgt.scrollIntoView({ block: t.t === 'draft' || t.t === 'placeDie' ? 'start' : 'center', behavior: 'smooth' }), 60);
  }

/* ---------- 사람 행동 ---------- */
const H = {
  undo() { if (undo()) { ui.lastHead = null; ui.shownFinal = G.over; render(); flash('한 수 무르기'); } },
  confirm() { act(() => G.q.shift()); render(); },
  draft(i) { act(() => { G.q.shift(); takeDie(ME(), i); }); render(); },
  choose(i) { act(() => { const t = G.q.shift(); log(`${ME().name}: ${t.opts[i].label} 선택`, ME().idx); front({ t: 'eff', p: t.p, eff: t.opts[i].eff }); }); render(); },
  dna(k) { act(() => { const t = head(); t.n--; addDNA(ME(), k, 1); log(`${ME().name}: ${DNA_NAME[k]} DNA 획득`, ME().idx); }); render(); },

  useRoad() { act(() => useStoredRoad(ME())); render(); },

  storeRoad() { act(() => storeRoad(ME())); render(); },

  <li><b>도로</b>: 한 칸이 두 변을 잇습니다(갈림길·교차 불가). 보관 5칸.</li><li><b>경비 vs 위협</b>: 운영 단계 끝에 (위협 − 경비)만큼 사망자가 생깁니다. 매 운영 단계마다 다시 계산됩니다!</li>
  <li><b>스릴</b>: 트랙에 표시된 아이콘이 운영 단계마다 수입이 됩니다. 가장 아래 줄 ★ 점수.</li></ul>
  <h4>건물 배치</h4><p>회전·뒤집기 가능. 다른 건물과 변/모서리가 닿으면 안 됩니다(본관 포함). 공룡 종마다 우리 1개(초식 2×2, 소형 육식 3×3, 대형 육식 4×4). 어트랙션은 종류별 최대 4개. 부착 건물(염소 우리 등)은 지정된 우리에 붙여야 합니다.</p>
  <h4>공원 운영</h4><ol><li>어트랙션 수입 (기념품=주사위 굴림, 놀이기구=스릴, 음식점=코인)</li><li>전문가 운영 능력(➜)</li><li>공룡 투어: HQ에서 도로로 연결된 건물을 되돌아가지 않고 지나가며, 새로 방문한 건물마다 스릴 1. 출입구에서 끝나면 출입구 ★ (최대 3번).</li><li>스릴 수입</li><li>사망자 집계 → ! 칸마다 재난</li></ol>
  <h4>최종 점수</h4><p>초식 2 / 소형 육식 3 / 대형 육식 5 (살아 있는 공룡) · 전문가 3 · 건물 카드 · 연결된 출입구 · 스릴 줄 점수 + 60 초과분 · 보관 DNA 2개당 1 · 사망 1명당 −1 (21명부터 −2). 동점이면 공룡이 많은 쪽 승리.</p>
  <h4>이 사이트에서</h4><ul><li>↶ <b>무르기</b>: 주사위 굴림 전까지 내 선택을 되돌립니다(Ctrl+Z). 컴퓨터의 행동도 함께 되돌아갑니다.</li><li>지도 배치: 마우스를 올려 미리보기, R키/우클릭으로 회전, 클릭으로 놓기.</li>
  <li>주사위 10개의 면 구성은 규칙서에 목록이 없어, 규칙서 사진 예시를 바탕으로 재구성했습니다(한 면 최대 위협 2).</li><li>2인 게임이며 3~4인 전용 요소는 빠져 있습니다. 게임은 자동 저장되어 새로고침해도 이어집니다.</li></ul></div>`, 'wide');
}
window.addEventListener('touchstart', () => { ui.touch = true; }, { once: true, passive: true });

  HOOK.onRandom = () => { UNDO = []; };
  let loaded = false;
  try { const s = localStorage.getItem('rawr_kr_save'); if (s) { G = JSON.parse(s); loaded = !G.over; } } catch (e) { }
  if (!G) { newGame({ ais: [false, true] }); }
  ui.view = humanIdx(); ui.shownFinal = G.over;
  ui.hasSave = loaded;
  render();
  showSetup(true);
});
