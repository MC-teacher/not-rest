<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매직 넘버 일레븐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 경기장 전광판처럼 또렷하고 경쾌하게
   IDEA: 실제 보드게임 판(필드·컨트롤 트랙·시너지 보드)을 화면에 옮긴 것
   PICTURE: 두 팀의 체크무늬 필드 자체가 그림
   COLOUR and TYPE: 잔디 녹색 바탕, 흰 카드, 포지션 빨강/초록/파랑, 강조 노랑 / Black Han Sans + Noto Sans KR
   LAYOUT: 점수판 → 상대 정보 → 필드+트랙 → 행동 패널 → 내 카드 */
:root{color-scheme:light dark;--bg:light-dark(#1d6b3c,#0f2f1d);--pitch:#2f9a50;--pitch2:#278a46;--ink:#f6f8f2;--panel:light-dark(#0f4a29,#0a2214);--card:#fffdf7;--fw:#d9363e;--mf:#2a9a46;--df:#2f74c0;--gold:#ffd23f;--muted:#b9d8c2}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#app{max-width:620px;margin:0 auto;padding:8px 8px 40px}
h1,.disp{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:.5px}
button{font:inherit;cursor:pointer}
.btn{background:var(--card);color:#123;border:0;border-radius:12px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.go{background:var(--gold);color:#222}
.btn.red{background:var(--fw);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(255,255,255,.45)}
.btn:disabled{opacity:.4}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#0b1f14;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.sb{display:flex;align-items:center;gap:10px}
.sb .n{font-family:'Black Han Sans';font-size:30px;color:var(--gold);background:#000;border-radius:8px;padding:0 10px;line-height:1.25;min-width:42px;text-align:center}
.sb .t{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.meta{font-size:12px;color:var(--muted);text-align:center}
.panel{background:var(--panel);border-radius:14px;padding:10px;margin:8px 0}
.small{font-size:12.5px;color:var(--muted)}
.opp{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.board{display:flex;gap:6px;justify-content:center;align-items:stretch}
.halves{display:flex;flex-direction:column;align-items:center}
.halfwrap{position:relative}
.halfwrap.flip{transform:rotate(180deg)}
.flip .txt{transform:rotate(180deg)}
.strip{position:absolute;left:0;overflow:hidden}
.grid{position:absolute;left:0;border-radius:4px;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.cell{position:absolute;background:var(--pitch)}
.cell.k{background:var(--pitch2)}
.cell.ok{box-shadow:inset 0 0 0 2px var(--gold);background-image:linear-gradient(rgba(255,210,63,.28),rgba(255,210,63,.28))}
.line{position:absolute;left:0;height:0;border-top:2px dashed}
.mid{height:8px;width:100%;display:flex;align-items:center}
.mid div{height:2px;background:rgba(255,255,255,.8);width:100%}
.card{position:absolute;overflow:hidden;border-radius:6px;background:var(--card);color:#222;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.card .band{position:absolute;top:0;bottom:0;left:0;width:30%}
.card.FW .band{background:var(--fw)}.card.MF .band{background:var(--mf)}.card.DF .band{background:var(--df)}
.card .txt{position:absolute;inset:0}
.card .pos{position:absolute;left:33%;top:12%;font-size:9px;font-weight:900;color:#fff;border-radius:3px;padding:0 3px;line-height:1.3}
.FW .pos{background:var(--fw)}.MF .pos{background:var(--mf)}.DF .pos{background:var(--df)}
.card .nm{position:absolute;left:33%;right:3px;top:34%;font-size:10px;font-weight:900;line-height:1.05;letter-spacing:-.3px}
.FW .nm{color:var(--fw)}.MF .nm{color:var(--mf)}.DF .nm{color:var(--df)}
.card .ef{position:absolute;left:33%;bottom:15%;font-size:8.5px;font-weight:700;color:#7a5a00}
.card .star{position:absolute;left:3px;top:3px;font-size:9px;color:#fff;font-weight:900}
.card.sel{outline:3px solid var(--gold);outline-offset:1px}
.card.last{box-shadow:0 0 0 3px #fff,0 0 12px 3px var(--gold)}
.card.da{outline:3px solid var(--fw);outline-offset:1px;cursor:pointer}
.card.ghost{opacity:.75;outline:2px dashed var(--gold)}
.card.out{filter:grayscale(1);opacity:.55}
.hi{position:absolute;transform:translate(-50%,-50%);line-height:0}
.hi svg,.ci svg{width:100%;height:100%;display:block}
.ci{position:absolute;transform:translate(-50%,-50%);line-height:0}
.ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2.5px solid var(--gold);pointer-events:none;z-index:5}
.tok{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#111;color:#fff;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:6;border:1.5px solid #fff;pointer-events:none}
.track{display:flex;flex-direction:column;width:34px;border-radius:8px;overflow:hidden;background:#b8262d;padding:3px;gap:3px;align-self:center}
.tc{flex:1;display:flex;gap:2px;align-items:center;justify-content:center;background:#e2524f;border-radius:4px;position:relative;min-height:30px}
.tc i{display:block;width:6px;align-self:stretch;border-radius:2px}
.tc .mk{width:20px;height:20px;border-radius:50%;background:#111;border:2px solid #fff;position:absolute}
.tlab{font-size:10px;text-align:center;color:#fff;font-weight:700}
.hand{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x proximity}
.hand .slot{position:relative;flex:none;scroll-snap-align:start}
.syn{display:flex;gap:6px;flex-wrap:wrap}
.sc{background:#123b26;border:2px solid #2f6e48;border-radius:10px;padding:6px 8px;min-width:54px;min-height:44px;text-align:center;color:var(--gold);font-weight:900;font-size:14px;line-height:1.1}
.sc small{display:block;font-size:10px;color:#ff8f8f;font-weight:700}
.sc.on{background:var(--gold);color:#222;border-color:#fff}
.sc.back{color:#8fbca0;background:repeating-linear-gradient(45deg,#174a30,#174a30 5px,#1c5838 5px,#1c5838 10px)}
button.sc{font:inherit;font-weight:900}
.prompt{font-weight:700;margin-bottom:8px}
.log{font-size:12.5px;color:#dfeee3;max-height:150px;overflow:auto;background:#0b1f14;border-radius:10px;padding:8px}
.log div{padding:1px 0}
.log .me{color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#0f3a22;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px 22px;box-shadow:0 -6px 30px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 8px;font-family:'Black Han Sans';font-weight:400;font-size:24px}
.big{font-family:'Black Han Sans';font-size:40px;color:var(--gold);text-align:center;line-height:1.1;margin:8px 0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{background:#0b1f14;border-radius:12px;padding:10px}
.goal{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:60px 60px;gap:6px;background:repeating-linear-gradient(60deg,#fff1,#fff1 2px,transparent 2px,transparent 10px);border:5px solid #222;border-bottom:0;padding:6px;border-radius:4px 4px 0 0}
.goal button{border-radius:50%;border:3px solid #fff;background:#fff2;color:#fff;font-weight:900;width:52px;height:52px;justify-self:center;align-self:center}
.goal .c{grid-column:2;grid-row:1/3}
.goal button.hit{background:var(--fw)}.goal button.blk{background:var(--df)}
.cards-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pick{position:relative;cursor:pointer;border-radius:8px}
.pick.on{outline:3px solid var(--gold);outline-offset:2px}
.desc{font-size:11.5px;color:#cfe5d6;text-align:center;max-width:120px;margin-top:3px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;z-index:80;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.home h1{font-size:44px;color:var(--gold);margin:18px 0 0;line-height:1.05;text-align:center}
.rules{font-size:14px;line-height:1.6}
.rules h3{margin:14px 0 4px;color:var(--gold);font-size:15px}
.rules ul{margin:0;padding-left:18px}
.chip{display:inline-flex;align-items:center;gap:3px;background:#0b1f14;border-radius:8px;padding:2px 7px;font-size:12px;margin:2px}
.chip i{width:14px;height:14px;display:inline-block}
@media (prefers-reduced-motion:no-preference){.card.last{animation:pop .5s ease}@keyframes pop{from{transform:scale(1.15)}to{transform:none}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
//ENGINE START
const DEFS={
 striker:{name:'스트라이커',pos:'CF',cls:'FW',s:{tl:'B',tr:'B',l:'B',r:'B',bl:'B',br:'R'}},
 lwing:{name:'윙어',pos:'LWF',cls:'FW',s:{tr:'B',r:'B',bl:'R',br:'B'},crack:1},
 rwing:{name:'윙어',pos:'RWF',cls:'FW',s:{tl:'B',l:'B',bl:'B',br:'R'},crack:1},
 playmaker:{name:'플레이메이커',pos:'CMF',cls:'MF',s:{tl:'R',tr:'B',l:'P',r:'P',bl:'P',br:'R'}},
 chance:{name:'찬스메이커',pos:'AMF',cls:'MF',s:{tl:'B',tr:'B',l:'P',r:'P',br:'R'}},
 tempo:{name:'템포조절',pos:'DMF',cls:'MF',s:{tl:'R',tr:'P',l:'P',r:'P',br:'P'},eff:['pick']},
 cb1:{name:'중앙수비수',pos:'CB',cls:'DF',s:{tl:'P',bl:'S',br:'S'}},
 cb2:{name:'중앙수비수',pos:'CB',cls:'DF',s:{tr:'P',bl:'S',br:'S'}},
 lb:{name:'측면수비수',pos:'LB',cls:'DF',s:{tr:'R',r:'P',br:'S'},eff:['draw']},
 rb:{name:'측면수비수',pos:'RB',cls:'DF',s:{tl:'R',l:'P',bl:'S'},eff:['draw']},
 targetman:{star:1,name:'타겟맨',pos:'CF',cls:'FW',s:{tl:'B',tr:'B',bl:'B',br:'B'},center:['B']},
 supercrack:{star:1,name:'슈퍼크랙',pos:'SS',cls:'FW',s:{tl:'R',tr:'R',l:'B',r:'B',bl:'B',br:'B'},crack:2},
 dribbler:{star:1,name:'드리블러',pos:'SS',cls:'FW',s:{tl:'B',tr:'B',l:'P',r:'P',bl:'R',br:'R'},eff:['ctrl1','steal']},
 linebreaker:{star:1,name:'라인 브레이커',pos:'CF',cls:'FW',s:{tl:'B',tr:'R',l:'B',r:'B',bl:'R',br:'B'},eff:['ctrl2']},
 maestro:{star:1,name:'마에스트로',pos:'CMF',cls:'MF',s:{tl:'R',tr:'R',l:'P',r:'P',bl:'P',br:'P'},eff:['ctrl1','draw']},
 hustle:{star:1,name:'허슬플레이',pos:'CMF',cls:'MF',s:{tl:'R',tr:'R',l:'P',r:'P',bl:'R',br:'R'},eff:['draw','steal']},
 cannon:{star:1,name:'기습 중거리슛',pos:'DMF',cls:'MF',s:{tl:'R',tr:'P',l:'P',r:'P',bl:'R'},eff:['cannon']},
 killerpass:{star:1,name:'킬러패스',pos:'AMF',cls:'MF',s:{tl:'B',tr:'B',l:'B',r:'B',br:'R'},center:['P']},
 sweeper:{star:1,name:'스위퍼',pos:'CB',cls:'DF',s:{tl:'S',tr:'S',l:'P',r:'P',bl:'S',br:'S'},eff:['steal']},
 overlapL:{star:1,name:'오버래핑',pos:'LB',cls:'DF',s:{tr:'R',r:'P',br:'S'},center:['R']},
 overlapR:{star:1,name:'오버래핑',pos:'RB',cls:'DF',s:{tl:'R',l:'P',bl:'S'},center:['R']},
 libero:{star:1,name:'리베로',pos:'CB',cls:'DF',s:{tl:'R',tr:'R',l:'P',r:'P',bl:'S'},center:['S']}
};
const BASIC=['striker','lwing','rwing','playmaker','chance','tempo','cb1','cb2','lb','rb'];
const STARS=['targetman','supercrack','dribbler','linebreaker','maestro','hustle','cannon','killerpass','sweeper','overlapL','overlapR','libero'];
const RATING={striker:6,lwing:5,rwing:5,playmaker:5,chance:5,tempo:5,cb1:4,cb2:4,lb:4,rb:4,targetman:8,supercrack:7,dribbler:7,linebreaker:8,maestro:8,hustle:7,cannon:6,killerpass:8,sweeper:7,overlapL:6,overlapR:6,libero:8};
const EFTXT={ctrl1:'컨트롤 1칸 전진',ctrl2:'컨트롤 2칸 전진',draw:'시너지 1장 뽑기',pick:'2장 뽑아 1장 고르기',steal:'상대 시너지 1장 버리게 하기',cannon:'즉시 슈팅(기본 수비력 무시)'};
const EFSHORT={ctrl1:'⚡컨트롤+1',ctrl2:'⚡컨트롤+2',draw:'⚡드로우',pick:'⚡2장 중 1',steal:'⚡상대 -1',cannon:'⚡중거리슛'};
const ROWS={FW:[0,1],MF:[1,2],DF:[2,3]};
const SLOTS={agg:3,norm:2,def:1};
const STNAME={agg:'공격적',norm:'보통',def:'수비적'};
const PK_DEF=[[2,0],[2,1],[2,3],[2,4],[0,3],[1,4]];
const PK_DEFNAME=['가운데+왼쪽 위','가운데+오른쪽 위','가운데+왼쪽 아래','가운데+오른쪽 아래','왼쪽 다이브','오른쪽 다이브'];
const PK_SPOT=['왼쪽 위','오른쪽 위','가운데','왼쪽 아래','오른쪽 아래'];
const opp=T=>T==='H'?'A':'H';
function rnd(st){let t=(st.rng=(st.rng+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function shuffle(st,a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd(st)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function D(st,id){return DEFS[st.cards[id].k];}
function nm(st,id){const d=D(st,id);return d.name+'('+d.pos+')';}
function who(st,T){return T===st.human?'나':'컴퓨터';}
function log(st,t,mine){st.log.push({t,m:mine?1:0});if(st.log.length>120)st.log.splice(0,st.log.length-120);}
function stars(st,c){const s=st.syn[c];return '★'+s.v+(s.t?'(태클)':'');}

function newGame(human,seed){
 const st={rng:(seed>>>0)||7,human,phase:'draft',half:1,m:0,turnTeam:'H',deck:[],discard:[],syn:[],cards:{},tokens:[],log:[],injuryNext:false,inInjury:false,teams:{},shot:null,pk:null,lock:false,pick:null,shootCand:null,lastPlaced:null,so:null};
 for(const T of ['H','A']){const roster=BASIC.map(k=>{const id=T+'_'+k;st.cards[id]={k,team:T};return id;});st.teams[T]={roster,hand:[],field:[],subs:[],subsOut:[],subsUsed:0,sh:[],score:0};}
 STARS.forEach(k=>{st.cards['S_'+k]={k,team:null};});
 [[1,0,1],[1,1,2],[2,0,5],[3,0,10],[4,0,5],[5,0,2]].forEach(([v,t,n])=>{for(let i=0;i<n;i++)st.syn.push({v,t:!!t});});
 st.deck=shuffle(st,st.syn.map((_,i)=>i));
 const pool=shuffle(st,STARS.map(k=>'S_'+k));
 st.draft={round:0,pool,revealed:pool.splice(0,3),order:['A','H'],step:0};
 log(st,'스타 선수 드래프트 시작! 1라운드는 원정팀이 먼저 고릅니다.');
 advance(st);return st;
}
function actor(st){
 switch(st.phase){
  case 'draft':return st.draft.order[st.draft.step];
  case 'team':case 'player':case 'pick':case 'shootAsk':return st.turnTeam;
  case 'attack':return st.shot.team;
  case 'defend':return opp(st.shot.team);
  default:return st.human;
 }
}
function advance(st){let g=0;while(actor(st)!==st.human&&g++<300){if(aiStep(st)===false)break;}}

// ---- 필드 / 아이콘 ----
function cellMap(field){const m={};for(const f of field){m[f.r+','+f.c]=f;m[f.r+','+(f.c+1)]=f;}return m;}
function computeIcons(st,T,field){
 field=field||st.teams[T].field;const m=cellMap(field);const out={};
 const add=(key,type,ids)=>{if(!out[key])out[key]={key,type,ids};};
 for(const f of field){const d=D(st,f.id),s=d.s;
  [['tl',f.c],['tr',f.c+1]].forEach(([sl,col])=>{const t=s[sl];if(!t)return;
   if(f.r===0){if(t==='B'&&col>=1&&col<=6)add('V:-1:'+col,'B',[f.id]);}
   else{const o=m[(f.r-1)+','+col];if(o){const os=D(st,o.id).s;const ot=col===o.c?os.bl:os.br;if(ot===t)add('V:'+(f.r-1)+':'+col,t,[o.id,f.id]);}}});
  if(f.r===3)[['bl',f.c],['br',f.c+1]].forEach(([sl,col])=>{if(s[sl]==='S'&&col>=1&&col<=6)add('V:3:'+col,'S',[f.id]);});
  if(s.r){const o=m[f.r+','+(f.c+2)];if(o&&o.c===f.c+2&&D(st,o.id).s.l===s.r)add('H:'+f.r+':'+(f.c+2),s.r,[f.id,o.id]);}
  (d.center||[]).forEach((t,i)=>add('C:'+f.id+':'+i,t,[f.id]));
 }
 const tk=new Set(st.tokens.filter(t=>t.team===T).map(t=>t.key));
 return Object.values(out).filter(i=>!(i.type==='B'&&tk.has(i.key)));
}
const cnt=(ic,t)=>ic.filter(i=>i.type===t).length;
function basicOf(st,T,id,field){return computeIcons(st,T,field).filter(i=>i.type==='B'&&i.ids.includes(id)).length;}
function canPlace(st,field,id,r,c){
 if(!ROWS[D(st,id).cls].includes(r)||c<0||c>6)return false;
 const m=cellMap(field);if(m[r+','+c]||m[r+','+(c+1)])return false;
 if(r===0&&!field.some(o=>(o.r===0&&(o.c===c-2||o.c===c+2))||(o.r===1&&Math.abs(o.c-c)<=1)))return false;
 return true;
}
function legalPlacements(st,T){const tm=st.teams[T],out=[];for(const id of tm.hand)for(let r=0;r<4;r++)for(let c=0;c<7;c++)if(canPlace(st,tm.field,id,r,c))out.push({id,r,c});return out;}
function directCands(st,T){const ic=computeIcons(st,T);return st.teams[T].field.map(f=>f.id).filter(id=>ic.some(i=>i.type==='B'&&i.ids.includes(id)));}
function stateOf(st,T,m){if(m===undefined)m=st.m;const v=T==='H'?m:-m;return v===2?'agg':v>=0?'norm':'def';}
function ctrlRoom(st,T){return T==='H'?2-st.m:st.m+2;}
function moveCtrl(st,T,n,why){const k=Math.min(n,ctrlRoom(st,T));if(k<=0){log(st,why+': 컨트롤 마커가 이미 끝이라 효과 없음');return;}st.m+=T==='H'?k:-k;log(st,`${why}: 컨트롤 마커 ${k}칸 전진 → ${who(st,T)} ${STNAME[stateOf(st,T)]}`,T===st.human);}

// ---- 시너지 덱 ----
function refill(st){if(!st.inInjury&&!st.injuryNext){st.injuryNext=true;log(st,'시너지 덱 소진! 버린 카드를 섞어 새 덱을 만들고, 다음 턴이 추가시간입니다.');}if(st.discard.length)st.deck=shuffle(st,st.discard.splice(0));}
function drawSyn(st){if(!st.deck.length)refill(st);if(!st.deck.length)return null;const c=st.deck.pop();if(!st.deck.length)refill(st);return c;}

// ---- 턴 진행 ----
function teamOptions(st,T){const ic=computeIcons(st,T),p=cnt(ic,'P'),r=cnt(ic,'R'),hs=st.teams[T].sh.length,o=[];

function enterPlayer(st){const T=st.turnTeam;st.phase='player';

function place(st,T,id,r,c){const tm=st.teams[T];if(st.phase!=='player'||st.turnTeam!==T||!tm.hand.includes(id)||!canPlace(st,tm.field,id,r,c))return false;
 tm.hand=tm.hand.filter(x=>x!==id);tm.field.push({id,r,c});st.lastPlaced=id;
 log(st,`${who(st,T)}: ${nm(st,id)} 배치 (${['최전방','2선','3선','최종'][r]} 라인)`,T===st.human);
 let cannon=false;
 for(const e of D(st,id).eff||[]){
  if(e==='ctrl1'||e==='ctrl2')moveCtrl(st,T,e==='ctrl1'?1:2,'즉시 효과');
  else if(e==='draw'){if(tm.sh.length<5)drawTo(st,T,1,'즉시 효과');else log(st,'즉시 효과: 손패가 5장이라 효과 없음');}

  else if(e==='cannon')cannon=true;
  else if(e==='pick'){if(tm.sh.length<5){const a=[];for(let i=0;i<2;i++){const x=drawSyn(st);if(x!=null)a.push(x);}
    if(a.length){st.pick={T,cards:a,id};if(T===st.human)st.lock=true;st.phase='pick';return true;}}
   else log(st,'즉시 효과(템포조절): 손패가 5장이라 효과 없음');}
 }

 log(st,`공격력 ${s.T} vs 수비력 ${s.defShown?s.D:'?'} → ${R[s.result]}`,A===st.human);

function scoreGoal(st,T){st.teams[T].score++;st.m=0;log(st,`⚽ ${who(st,T)} 득점! (${st.teams.H.score} : ${st.teams.A.score}) 컨트롤 마커는 가운데로.`,T===st.human);}

function pkPick(st,choice){const p=st.pk;if(!p||p.result)return false;

 p.spot=spot;p.blk=blk;p.result=PK_DEF[blk].includes(spot)?'save':'goal';st.lock=true;
 log(st,`페널티킥: ${PK_SPOT[spot]} 슈팅 vs ${PK_DEFNAME[blk]} → ${p.result==='goal'?'골!':'막았다!'}`,p.att===st.human);

function endTurn(st){st.shot=null;st.pk=null;st.shootCand=null;st.pick=null;if(st.inInjury){endHalf(st);return;}st.turnTeam=opp(st.turnTeam);startTurn(st);}

  for(const T of ['H','A']){const tm=st.teams[T];tm.hand.push(...tm.field.map(f=>f.id));tm.field=[];tm.sh=[];}
  st.tokens=[];st.discard=[];st.deck=shuffle(st,st.syn.map((_,i)=>i));st.m=0;st.lastPlaced=null;
  aiHalftimeSubs(st,opp(st.human));st.phase='halftime';}

function startSecondHalf(st){if(st.phase!=='halftime')return false;st.half=2;st.turnTeam='A';log(st,'후반 시작! 후반은 원정팀 선공입니다.');startTurn(st);return true;}
function canSub(st,T){const tm=st.teams[T];return tm.subsUsed<3&&tm.subs.length>0&&(st.phase==='halftime'||((st.phase==='team'||st.phase==='player')&&st.turnTeam===T));}

function startShootout(st){if(st.phase!=='gameover'||st.teams.H.score!==st.teams.A.score||st.so)return false;st.so={k:{H:[],A:[]},idx:0,last:null,winner:null};st.phase='shootout';log(st,'승부차기 시작!');return true;}

// ---- AI ----
function poolOf(st,T){const mine=new Set(st.teams[T].sh);return st.syn.map((c,i)=>i).filter(i=>!mine.has(i)).map(i=>st.syn[i]);}

 for(const a in vd){const pa=vd[a];dd[Dd+ +a]=(dd[Dd+ +a]||0)+pa*(1-q);for(const b in vd){const k=Dd+ +a+ +b;dd[k]=(dd[k]||0)+pa*vd[b]*q;}}

 return A0=>{let p=0;for(const x in vd){const T=A0+ +x,px=vd[x];if(T>=12)continue;if(T===11)p+=px*(0.85+0.15*0.6);else p+=px*((1-pt)*less(T)+pt*0.6);}return p;};}

 const S=cnt(ic,'S');return 0.8*cnt(ic,'P')+0.7*cnt(ic,'R')+1.2*Math.min(S,6)+0.4*Math.max(0,S-6)+1.3*maxB+0.35*sumB;}
function aiTeam(st,T){const o=teamOptions(st,T);if(!o.length){enterPlayer(st);return;}let best=o[0],bv=-1e9;const hs=st.teams[T].sh.length;
 for(const x of o){let v;if(x.type==='pass')v=x.n*(SLOTS[stateOf(st,T)]>1?0.95:0.75)+(hs===0?0.6:0)-(st.deck.length<=x.n&&!st.injuryNext?0.3:0);

function aiStep(st){const T=actor(st);

  case 'draft':{const r=st.draft.revealed.slice().sort((a,b)=>RATING[st.cards[b].k]-RATING[st.cards[a].k]);draftPick(st,T,r[0]);return true;}
  case 'team':aiTeam(st,T);return true;
  case 'player':aiSubs(st,T);aiPlayer(st,T);return true;
  case 'pick':{const c=st.pick.cards.slice().sort((a,b)=>(st.syn[b].t?1.5:st.syn[b].v)-(st.syn[a].t?1.5:st.syn[a].v))[0];choosePick(st,T,c);return true;}
  case 'shootAsk':{const sc=st.shootCand,d=D(st,sc.id);const e=sc.cannon?shotEV(st,T,1,0,true):shotEV(st,T,basicOf(st,T,sc.id),d.crack||0,false);shootDecision(st,T,e.ev>0);return true;}
  case 'attack':{const s=st.shot;const e=shotEV(st,T,s.basic,s.crack,s.ignoreDef);attackCommit(st,T,e.ids.slice(0,s.slots-1));return true;}
  case 'defend':aiDefend(st,T);return true;
 }
 return false;}
function aiDefend(st,T){const s=st.shot,tm=st.teams[T];const {Dbase}=defBase(st,s);const pool=poolOf(st,T);const {vd,vn,pt}=vdist(pool);
 let td={[s.basic]:1};for(let i=0;i<s.atk.length;i++){const n={};for(const a in td)for(const x in vd){const k=+a+ +x;n[k]=(n[k]||0)+td[a]*vd[x];}td=n;}
 const opts=[{o:'none',h:0},{o:'deck',h:0}];const seen=new Set();tm.sh.forEach(c=>{const s2=st.syn[c];const key=s2.v+'|'+s2.t;if(!seen.has(key)){seen.add(key);opts.push({o:c,h:s2.v,t:s2.t});}});
 const winD=(T0,Dv)=>(T0===11&&!s.unorg)?0:(Dv>=T0?1:0);
 let best=null;
 for(const op of opts){let save=0;
  for(const a in td){const T0=+a,p=td[a];if(T0>=12){save+=p;continue;}
   if(op.t){save+=p*0.4;continue;}
   let x=pt*0.4;for(const y1 in vn){const base=Dbase+ +y1+op.h;let w;
    if(op.o==='deck'){w=pt*0.4;for(const y2 in vn)w+=(1-pt)*vn[y2]*winD(T0,base+ +y2);}else w=winD(T0,base);
    x+=(1-pt)*vn[y1]*w;}
   save+=p*x;}
  const sc=save-(typeof op.o==='number'?0.025*op.h+(op.t?0.05:0):0);if(!best||sc>best.sc)best={sc,o:op.o};}
 defendCommit(st,T,best.o);}

function rulesModal(){return `<div class="modal"><div class="sheet rules"><h2>게임 규칙 요약</h2>
<h3>준비</h3><ul><li>스타 선수 12장 중 3장씩 공개 → 번갈아 1장씩 3라운드 드래프트 (1·3라운드 원정 먼저, 2라운드 홈 먼저).</li><li>13명 중 선발 10명, 교체 3명. 경기 중·하프타임에 교체 최대 3회.</li></ul>
<h3>아이콘</h3><ul><li>카드 가장자리의 반쪽 아이콘이 옆 카드(또는 필드 끝의 반쪽 아이콘)와 맞물리면 완성. 노란 고리가 완성 표시예요.</li><li><b>공격</b>(공): 슈터의 기본 공격력 · <b>수비</b>(방패): 팀 기본 수비력 · <b>패스</b>(✚): 시너지 카드 뽑기 · <b>프레스</b>(⬆): 컨트롤 마커 전진.</li><li>최전방 위에는 공 반쪽, 최종 라인 아래엔 방패 반쪽이 있어요.</li></ul>
<h3>내 턴</h3><ul><li><b>① 팀 액션</b>: 패스(✚ 수만큼 뽑기, 손패 최대 5) 또는 프레스(⬆ 수만큼 마커 전진) 중 하나. 아이콘은 쌓여요.</li><li><b>② 선수 액션</b>: 선수 1장 배치(즉시 효과 적용 후 그 선수로 슈팅 가능) 또는 이미 필드에 있는 선수로 직접 슈팅.</li><li>FW는 최전방·2선, MF는 2선·3선, DF는 3선·최종 라인. 최전방은 다른 카드와 붙어야 해요.</li></ul>
<h3>슈팅</h3><ul><li>슈터의 공 아이콘에 슛 토큰을 놓고 쏩니다. 이후 그 아이콘은 빈칸 → 같은 선수는 점점 약해져요.</li><li>공격 시너지: 덱 1장(필수, 확인 불가) + 컨트롤 상태에 따라 손패 추가 (공격적 2장, 보통 1장, 수비적 0장).</li><li>수비 시너지: 덱 1장(필수) + 손패나 덱에서 1장(선택). 상태와 무관.</li><li>크랙(방패에 ✕): 슈터가 가진 수만큼 상대 기본 수비력 감소.</li><li>공격력 1~10: 수비력보다 높으면 골 · <b>정확히 11: 원더골</b> · 12 이상: 볼 아웃.</li><li>수비 측 태클 카드가 공개되면 결과 취소 후 페널티킥 (볼 아웃이면 무효).</li><li>골이 나면 컨트롤 마커는 가운데로.</li></ul>
<h3>시간</h3><ul><li>시너지 덱이 떨어지면 버린 카드를 섞고, 다음 턴이 추가시간(팀 액션 없음) → 그 턴이 끝나면 하프 종료.</li><li>하프타임: 필드 선수 회수, 시너지 전부 재셔플, 후반은 원정팀 선공. 동점이면 승부차기 선택.</li></ul>
<h3>무르기</h3><ul><li>내 행동은 되돌릴 수 있어요. 단, 덱에서 카드를 뽑아 확인했거나 상대 카드가 공개(슈팅 결과, 페널티킥)되면 그 이전으로는 되돌릴 수 없어요.</li></ul>

<p class="small">원작: Magic Number Eleven (Bonghwan Ju · Olin Jeong / Pluto Games) 규칙서를 바탕으로 만든 비공식 연습용 구현입니다.</p>
<div class="row" style="justify-content:center"><button class="btn go" data-act="closerules">닫기</button></div></div></div>`;}

  case 'selcard':ui.sel=ui.sel===el.dataset.id?null:el.dataset.id;ui.ghost=null;ui.mode=null;render();break;
  case 'cell':{if(!ui.sel||st.phase!=='player')break;const r=+el.dataset.r,c=+el.dataset.c;const f=st.teams[me].field;
   let cc=null;if(canPlace(st,f,ui.sel,r,c))cc=c;else if(canPlace(st,f,ui.sel,r,c-1))cc=c-1;if(cc===null)break;ui.ghost={id:ui.sel,r,c:cc};render();break;}
  case 'ghost':{if(!ui.ghost)break;const g=ui.ghost;const f=st.teams[me].field;const alt=[g.c+1,g.c-1].find(c=>canPlace(st,f,g.id,g.r,c));if(alt!==undefined){ui.ghost={...g,c:alt};render();}break;}
  case 'place':{const g=ui.ghost;if(g)act(()=>place(st,me,g.id,g.r,g.c));break;}
  case 'cancel':ui.sel=null;ui.ghost=null;ui.mode=null;render();break;
  case 'damode':ui.mode='da';ui.sel=null;ui.ghost=null;render();break;
  case 'da':act(()=>directAttack(st,me,el.dataset.id));break;
  case 'pickc':act(()=>choosePick(st,me,+el.dataset.c));break;
  case 'shoot':act(()=>shootDecision(st,me,el.dataset.y==='1'));break;
  case 'atkc':{const c=+el.dataset.c;const k=st.shot.slots-1;if(ui.atk.includes(c))ui.atk=ui.atk.filter(x=>x!==c);else if(ui.atk.length<k)ui.atk.push(c);else toast(`지금 상태에선 손패를 최대 ${k}장까지 낼 수 있어요`);render();break;}
  case 'attack':{const ids=ui.atk.slice();act(()=>attackCommit(st,me,ids));break;}
  case 'def':{const o=el.dataset.o;act(()=>defendCommit(st,me,o==='none'||o==='deck'?o:+o));break;}
  case 'reveal':act(()=>revealContinue(st));break;
  case 'pkc':act(()=>pkPick(st,+el.dataset.v));break;
  case 'pkdone':act(()=>pkContinue(st));break;
  case 'submode':ui.mode=ui.mode==='sub'?null:'sub';ui.sel=null;ui.ghost=null;ui.subOut=null;ui.subIn=null;render();break;
  case 'subout':ui.subOut=el.dataset.id;render();break;
  case 'subin':ui.subIn=el.dataset.id;render();break;
  case 'dosub':{const o=ui.subOut,i=ui.subIn;act(()=>substitute(st,me,o,i));break;}
  case 'half2':act(()=>startSecondHalf(st));break;
  case 'so':act(()=>startShootout(st));break;
  case 'soc':act(()=>soKick(st,+el.dataset.v));break;
  case 'close':ui.closed=true;render();break;
 }
});
let rt=null;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120);});
load();render();
}
}
</script>
</body>
</html>
