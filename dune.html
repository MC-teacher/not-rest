<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>듄: 임페리움 업라이징 – 한글판 (컴퓨터 대전)</title>
<style>
:root{--bg:#1b1510;--panel:#2a2119;--panel2:#352a1f;--line:#4a3b2b;--text:#f3e7d3;--dim:#b9a78c;--gold:#e9b44c;--hi:#ffd36b;
--emp:#b8453a;--guild:#c77d2a;--bg-f:#7b5aa6;--fremen:#3e8a8a;--land:#5d7f3b;--city:#7a6a55;--spice:#c6902e;--spy:#555}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:8px 8px 230px}
.top{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.title{font-size:12px;color:var(--dim);margin-bottom:4px;letter-spacing:.02em}
.conf{flex:1 1 300px}
.conf .nm{font-size:17px;font-weight:700;color:var(--hi)}
.lvl{display:inline-block;background:#6b3a1c;border-radius:4px;padding:0 6px;font-size:12px;margin-right:6px}
.rw{font-size:13px;margin-top:3px}
.rw b{color:var(--gold)}
.status{flex:1 1 200px;font-size:13px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:6px;margin-bottom:8px}
.pl{border-left:5px solid;border-radius:10px;background:var(--panel);padding:6px 8px;font-size:12.5px;position:relative}
.pl.cur{outline:2px solid var(--hi)}
.pl .h{display:flex;justify-content:space-between;align-items:baseline}
.pl .h b{font-size:14px}
.vp{font-size:20px;font-weight:800;color:var(--hi)}
.res{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0}
.tag{display:inline-block;border-radius:4px;padding:0 5px;font-size:11px;margin:1px 2px 1px 0;background:#444;color:#fff;white-space:nowrap}
.t-emp{background:var(--emp)}.t-guild{background:var(--guild)}.t-bg{background:var(--bg-f)}.t-fremen{background:var(--fremen)}.t-land{background:var(--land)}.t-city{background:var(--city)}.t-spice{background:var(--spice)}.t-spy{background:#333;border:1px solid #888}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:6px;margin-bottom:8px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.sec h3{font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between}
.sp{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;margin-bottom:4px;position:relative}
.sp .n{font-weight:700}
.sp .d{font-size:11.5px;color:var(--dim)}
.sp.legal{border:2px solid var(--hi);background:#4a3a1c;box-shadow:0 0 8px #ffd36b66}
.sp.dim{opacity:.45}
.occ{position:absolute;right:6px;top:5px;display:flex;gap:3px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #000;display:inline-block}
.cmb{color:#ff8a6b;font-size:11px}
.post{font-size:11px;color:var(--dim);margin:2px 0 4px}
.inf table{width:100%;border-collapse:collapse;font-size:12.5px}
.inf td,.inf th{border-bottom:1px solid var(--line);padding:3px;text-align:center}
.inf td:first-child,.inf th:first-child{text-align:left}
.market{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.card{flex:0 0 150px;width:150px;background:#f1e4cc;color:#2a1d10;border-radius:9px;padding:5px 6px 6px;font-size:11px;position:relative;border:2px solid transparent;text-align:left}
.card .cn{font-weight:800;font-size:12.5px;padding-right:22px;line-height:1.2}
.card .en{font-size:9.5px;color:#7a6650}
.card .cost{position:absolute;right:5px;top:4px;background:#2a1d10;color:#ffd36b;border-radius:50%;width:20px;height:20px;text-align:center;font-weight:800;line-height:20px;font-size:12px}
.card .ab{margin-top:3px;border-top:1px dashed #b49b78;padding-top:2px}
.card .ab b{color:#6b3a1c}
.card .fc{height:4px;border-radius:2px;margin:3px 0}
.card.sel{border-color:#ff5a00;transform:translateY(-6px);box-shadow:0 6px 14px #000a}
.card.can{border-color:#3aa35a}
.card.no{opacity:.5}
.handbar{position:fixed;left:0;right:0;bottom:0;background:#120e0aee;border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(4px);z-index:5}
.handbar .row{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;max-width:1100px;margin:0 auto}
.hb-top{display:flex;gap:6px;align-items:center;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.msg{flex:1;font-size:13px;color:var(--hi);min-width:160px}
.btn{background:#8a4a1c;border:1px solid #c27a3c;border-radius:8px;padding:7px 12px;font-weight:700}
.btn.sec2{background:#3a2e22;border-color:var(--line)}
.btn:disabled{opacity:.4}
.ic{background:#2d2440;border:1px solid #7b5aa6;border-radius:8px;padding:4px 7px;font-size:11.5px;text-align:left;max-width:170px}
.ic.combat{border-color:#b8453a;background:#3a1f1c}.ic.end{border-color:#c6902e;background:#3a2c15}
.ic:disabled{opacity:.5}
.log{max-height:240px;overflow:auto;font-size:12px}
.log div{padding:1px 0;border-bottom:1px solid #2f261c}
.log .l-round{color:var(--hi);font-weight:700}.log .l-imp{color:#ff9d6b}.log .l-vp{color:#9be07a}.log .l-int{color:#c4a7ff}.log .l-act{color:#fff}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:82vh;overflow:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:14px}}
.mbox h2{font-size:16px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin:5px 0}
.opt small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.opt:disabled{opacity:.35}
.grid{display:flex;flex-wrap:wrap;gap:6px}.grid .opt{width:auto;min-width:54px;text-align:center;font-size:18px;font-weight:700}
.start{max-width:720px;margin:20px auto;padding:10px}
.start h1{font-size:24px;color:var(--hi)}
.choice{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.choice button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.choice button.on{border-color:var(--hi);background:#4a3a1c}
.ld{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin:6px 0 14px}
.ld button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}
.ld button.on{border-color:var(--hi);background:#4a3a1c}
.ld small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.note{font-size:12px;color:var(--dim)}
details summary{cursor:pointer;color:var(--hi);font-weight:700}
.help p,.help li{font-size:13px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mb{margin-bottom:8px}

.mapwrap{overflow-x:auto;max-width:820px;margin-left:auto;margin-right:auto;margin-bottom:8px;border-radius:12px}
.map{position:relative;width:100%;aspect-ratio:100/122;container-type:inline-size;border-radius:12px;overflow:hidden;
 background:radial-gradient(ellipse at 70% 85%,#d9a35a 0,#b97a3a 35%,transparent 60%),radial-gradient(ellipse at 20% 95%,#c88e4a 0,transparent 45%),linear-gradient(#2a2119 0 52%,#a8692f 52.5%,#c98c47 100%);border:1px solid var(--line)}
.map.zoom{min-width:640px}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pn{position:absolute;border-radius:1.4cqw;border:1px solid #0006}
.pt{position:absolute;font-weight:800;font-size:max(9px,2.3cqw);color:#fff;text-shadow:0 1px 2px #000}
.tile{position:absolute;border-radius:1.2cqw;border:1px solid #0008;background:#2b2118ee;color:var(--text);text-align:left;padding:.5cqw .8cqw;overflow:hidden;box-shadow:0 .4cqw .8cqw #0007}
.tile .tn{font-weight:800;font-size:max(9.5px,2.25cqw);line-height:1.15}
.tile .tc{font-size:max(8px,1.75cqw);color:#f0d9b5;line-height:1.2;margin-top:.2cqw}
.tile .ti{display:inline-block;border-radius:.6cqw;padding:0 .6cqw;font-size:max(7.5px,1.6cqw);color:#fff;margin-right:.4cqw}
.tile.legal{border:.5cqw solid var(--hi);background:#5a4318f2;box-shadow:0 0 2cqw #ffd36bbb;z-index:2}
.tile.dim{opacity:.45}
.tile.city{background:#3d3226ee}.tile.desert{background:#5b3b17ee}
.pawns{position:absolute;right:.5cqw;bottom:.5cqw;display:flex;gap:.4cqw}
.pawn{width:3.2cqw;height:3.2cqw;border-radius:50% 50% 30% 30%;border:.35cqw solid #000;min-width:11px;min-height:11px}
.flag{position:absolute;right:.6cqw;top:.4cqw;font-size:max(9px,2cqw)}
.bonus{position:absolute;left:.8cqw;bottom:.4cqw;font-size:max(8px,1.7cqw);color:#ffd36b;font-weight:700}
.eye{position:absolute;width:4.6cqw;height:4.6cqw;min-width:16px;min-height:16px;transform:translate(-50%,-50%);border-radius:50%;background:#1a1410;border:.4cqw solid #c9b38f;display:flex;align-items:center;justify-content:center;font-size:max(9px,2.2cqw);z-index:1}
.chips{position:absolute;display:flex;gap:.6cqw;flex-wrap:wrap;align-items:center;font-size:max(8.5px,1.9cqw);color:#fff}
.chip{display:inline-flex;align-items:center;gap:.3cqw;background:#0006;border-radius:.8cqw;padding:0 .7cqw;font-weight:700}
.chip i{display:inline-block;width:1.9cqw;height:1.9cqw;min-width:8px;min-height:8px;border-radius:50%}
.cz{position:absolute;color:var(--text)}
.cz .cname{font-weight:800;font-size:max(11px,2.8cqw);color:var(--hi)}
.cz .crw{font-size:max(8.5px,1.85cqw);line-height:1.3}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw;margin-top:.8cqw}
.q{min-width:0;background:#0005;border-radius:1cqw;padding:.6cqw .9cqw;font-size:max(8.5px,1.9cqw);border-left:.8cqw solid}
.q .cubes{display:flex;flex-wrap:wrap;gap:.3cqw;margin-top:.3cqw;min-height:2cqw}
.cube{width:2cqw;height:2cqw;min-width:7px;min-height:7px;border-radius:.3cqw;border:1px solid #000}
.wall{position:absolute;left:1%;right:1%;height:1.6cqw;border-radius:1cqw;background:repeating-linear-gradient(90deg,#6d5a45 0 3cqw,#857059 3cqw 6cqw);border:1px solid #2a1d10;display:flex;align-items:center;justify-content:center;font-size:max(8px,1.7cqw);font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.wall.broken{background:repeating-linear-gradient(90deg,#6d5a45 0 3cqw,transparent 3cqw 8cqw);opacity:.75}
.maptool{max-width:820px;margin-left:auto!important;margin-right:auto!important;display:flex;justify-content:flex-end;gap:6px;margin:-2px 0 4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
// ===== 듄: 임페리움 – 업라이징 (한글 웹판) 게임 엔진 =====
const HEADLESS = typeof document === 'undefined';
let SPEED = 650;
const sleep = ms => (HEADLESS || SPEED === 0) ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }

const FAC = ['emp', 'guild', 'bg', 'fremen'];
const FN = { emp: '황제', guild: '우주 길드', bg: '베네 게세리트', fremen: '프레멘' };
const ICN = { emp: '황제', guild: '길드', bg: 'BG', fremen: '프레멘', land: '란드스라드', city: '도시', spice: '향신료 교역', spy: '첩자' };
const BATTLE = { crysknife: '크리스나이프', desertMouse: '사막쥐', ornithopter: '오니솝터' };
const COLORS = ['#e2574c', '#4a90d9', '#59b36b', '#e0b43a'];
const R = { spice: 1.3, solari: 0.6, water: 1.7, troop: 1.1, card: 1.1, intrigue: 1.4, vp: 6 };

let G = null;
let UI = { // UI 훅 (헤드리스에서는 빈 함수)
  render() {}, log() {}, ask: null, waitHuman: null, toast() {}
};

function log(msg, cls) { if (!G) return; G.log.unshift({ msg, cls, r: G.round }); if (G.log.length > 300) G.log.pop(); UI.log(msg, cls); }

// ---------- 선택 ----------
async function ask(p, title, opts, o = {}) {
  const en = opts.filter(x => !x.disabled);
  if (!en.length) return null;
  if (p.ai || !UI.ask) {
    let best = en[0];
    for (const x of en) if ((x.ai ?? 0) > (best.ai ?? 0)) best = x;
    if (o.cancel && (best.ai ?? 0) < (o.cancelAi ?? -0.01)) return null;
    return best.value;
  }
  return await UI.ask(title, opts, o);
}
async function askYN(p, title, aiYes, desc) {
  return await ask(p, title, [{ label: '예', value: true, ai: aiYes ? 1 : 0 }, { label: '아니오', value: false, ai: aiYes ? 0 : 1 }], { desc });
}
async function askNum(p, title, min, max, aiVal, desc) {
  const opts = []; for (let i = min; i <= max; i++) opts.push({ label: String(i), value: i, ai: i === aiVal ? 1 : 0 });
  return await ask(p, title, opts, { desc, grid: true });
}
async function askCard(p, title, cards, aiFn, cancel, desc) {
  if (!cards.length) return null;
  const opts = cards.map(c => ({ label: c.n, sub: c.icons ? cardLine(c) : c.t, value: c, ai: aiFn ? aiFn(c) : 0, card: c }));
  return await ask(p, title, opts, { cancel, desc, cancelAi: 0 });
}

// ---------- 카드 정의 ----------
const DEFS = {};
function D(id, n, en, o) { DEFS[id] = Object.assign({ id, n, en, cost: 0, fac: [], icons: [], p: 0, s: 0, count: 1 }, o); }
const hasInf = (p, f, n = 2) => p.inf[f] >= n;
const otherFremen = (p, card) => [...p.inPlay, ...p.revealed].some(c => c !== card && c.fac.includes('fremen'));

// 기본 덱
D('conv', '설득력 있는 논거', 'Convincing Argument', { start: 2, p: 2 });
D('dagger', '단검', 'Dagger', { start: 2, icons: ['land'], s: 1 });
D('diplo', '외교', 'Diplomacy', { start: 1, icons: ['emp', 'guild', 'bg', 'fremen'], p: 1 });
D('dune', '사막 행성 듄', 'Dune, the Desert Planet', { start: 2, icons: ['spice'], p: 1 });
D('recon', '정찰', 'Reconnaissance', { start: 1, icons: ['city'], p: 1 });
D('seek', '동맹 모색', 'Seek Allies', { start: 1, icons: ['emp', 'guild', 'bg', 'fremen'], at: '이 카드를 제거', agent: async (p, c) => trashSpecific(p, c.card), aiA: 1 });
D('signet', '인장 반지', 'Signet Ring', { start: 1, icons: ['land', 'city', 'spice'], p: 1, at: '리더의 인장 능력 사용', aiA: 1.5 });
// 예비 카드
D('ptw', '길을 준비하라', 'Prepare the Way', { reserve: true, cost: 2, fac: ['bg'], icons: ['land', 'city'], p: 2, at: 'BG 영향력 2+: 카드 1장', agent: async (p) => { if (hasInf(p, 'bg')) draw(p, 1); }, aiA: p => hasInf(p, 'bg') ? R.card : 0 });
D('tsmf', '향신료는 흘러야 한다', 'The Spice Must Flow', { reserve: true, cost: 9, fac: ['guild'], act: '승점 +1', rt: '향신료 +1', acquire: async p => addVP(p, 1, '향신료는 흘러야 한다'), reveal: async p => gain(p, 'spice', 1) });

// 임페리움 덱 (업라이징)
D('sardSoldier', '사다우카 병사', 'Sardaukar Soldier', { cost: 1, fac: ['emp'], icons: ['city'], p: 1, s: 1, xt: '제거될 때: 음모 카드 1장', onTrash: p => drawIntrigue(p, 1) });
D('harvester', '밀수꾼의 수확기', "Smuggler's Harvester", { count: 2, cost: 1, fac: ['guild'], icons: ['spice'], p: 1, at: '이번 턴 메이커 공간에 보냈다면: 향신료 +1', agent: async (p, c) => { if (c.maker) gain(p, 'spice', 1); }, aiA: (p, sid) => SP[sid].maker ? R.spice : 0 });
D('folding', '시공간 접기', 'Space-time Folding', { cost: 1, fac: ['guild'], icons: ['guild'], p: 1, at: '카드 1장 버림 → 1장 뽑기. 버린 카드가 길드면 1장 더', agent: async (p) => { const d = await discardFromHand(p, false, '버릴 카드 (취소 가능)'); if (d) { draw(p, 1); if (d.fac.includes('guild')) draw(p, 1); } }, aiA: 0.6 });
D('loyalty', '굳건한 충성', 'Unswerving Loyalty', { count: 2, cost: 1, fac: ['fremen'], p: 1, rt: '병력 +1', bt: '병력 1 배치 또는 후퇴', reveal: async (p) => recruit(p, 1), bond: async (p, c) => { if (p.garrison > 0 && (p.conflict + p.worms > 0 || G.conflict)) { if (await askYN(p, '굳건한 충성: 수비대 병력 1을 분쟁에 배치할까요?', G.conflict.level >= 2)) { p.garrison--; p.conflict++; } } } });
D('weirding', '기묘한 여인', 'Weirding Woman', { count: 2, cost: 1, fac: ['bg'], icons: ['city', 'spice'], p: 1, s: 1, at: 'BG 영향력 2+: 이 카드를 손으로 되돌림', agent: async (p, c) => { if (hasInf(p, 'bg')) c.returnToHand = true; }, aiA: p => hasInf(p, 'bg') ? 2 : 0 });
D('survival', '사막 생존', 'Desert Survival', { count: 2, cost: 2, fac: ['fremen'], icons: ['spice'], p: 1, s: 1, at: '카드 1장 제거', agent: async p => trashAny(p), aiA: 1 });
D('stilltent', '페다이킨 증류천막', 'Fedaykin Stilltent', { cost: 2, fac: ['fremen'], icons: ['spice'], rt: '물 +1', at: '이번 턴 메이커 공간: 병력 +1', agent: async (p, c) => { if (c.maker) recruit(p, 1, c); }, reveal: async p => gain(p, 'water', 1), aiA: (p, sid) => SP[sid].maker ? R.troop : 0 });
D('missive', '숨겨진 밀서', 'Hidden Missive', { cost: 2, fac: ['bg'], icons: ['land'], p: 1, s: 1, at: 'BG 영향력 2+: 병력 +1, 카드 1장', agent: async (p, c) => { if (hasInf(p, 'bg')) { recruit(p, 1, c); draw(p, 1); } }, aiA: p => hasInf(p, 'bg') ? 2.2 : 0 });

function cardVal(c) { return (c.cost || 0) + (c.p || 0) * 0.6 + (c.s || 0) * 0.4 + (c.id === 'signet' ? 3 : 0); }
function cardLine(c) {
  const a = [];
  if (c.icons.length) a.push('요원: ' + c.icons.map(i => ICN[i]).join('·'));
  if (c.at) a.push('▶ ' + c.at);
  const r = []; if (c.p) r.push(`설득 ${c.p}`); if (c.s) r.push(`검 ${c.s}`); if (c.rt) r.push(c.rt);
  if (r.length) a.push('공개: ' + r.join(', '));
  if (c.bt) a.push('프레멘 유대: ' + c.bt);
  return a.join(' / ');
}

  for (const m of moves) {
    const s = SP[m.sid], c = m.card;
    let v = s.ai(p);
    const cost = spaceCost(m.sid); for (const r in cost) v -= cost[r] * R[r];
    if (s.fac) v += infV(p, s.fac, (c.id === 'overthrow' || (c.id === 'subversive')) ? 2 : 1);
    if (s.combat && (p.garrison > 0 || v > 0)) v += G.conflict.level * 0.8 * Math.min(1, p.garrison / 2 + 0.3);
    if (s.ctrl && G.control[m.sid] === p.i) v += 0.6;
    if (m.infiltrate) v -= 1;
    v += typeof c.aiA === 'function' ? c.aiA(p, m.sid) : (c.aiA || 0);
    v -= (c.p || 0) * 0.55 + (c.s || 0) * 0.25 + (c.rt ? 0.8 : 0) + (c.bt ? 0.5 : 0);
    v += Math.random() * 0.6;
    if (v > bv) { bv = v; best = m; }
  }
  if (best && p.agentsAvail > 0) await doAgentTurn(p, best.card, best.sid);
  else await doReveal(p);
}

// ---------- 진행 ----------
function newGame(cfg) {
  UID = 0;
  POSTS = {}; for (const k in POSTS_DEF) POSTS[k] = { ...POSTS_DEF[k], occ: null };
  const leaders = shuffle(Object.keys(LEADERS).filter(l => l !== cfg.leader));
  const n = cfg.opponents + 1;
  const icons = shuffle(['ornithopter', 'crysknife', 'desertMouse', 'crysknife', 'desertMouse']);
  G = {
    round: 0, log: [], over: false,
    players: [], occ: {}, maker: { imperialBasin: 0, hagga: 0, deep: 0 }, shieldWall: true,
    alliance: { emp: null, guild: null, bg: null, fremen: null }, control: { arrakeen: null, refinery: null, imperialBasin: null },
    reserve: { ptw: 8, tsmf: 10 }, reserveCard: { ptw: mkCard('ptw'), tsmf: mkCard('tsmf') },
    intDeck: [], intDiscard: [], conflictDeck: [], conflict: null, row: [], impDeck: [], rctx: null,
  };
  for (const s in SP) G.occ[s] = [];
  const names = ['나', '컴퓨터 1', '컴퓨터 2', '컴퓨터 3'];
  for (let i = 0; i < n; i++) {
    const human = i === 0 && !cfg.allAI;
    const leader = i === 0 && cfg.leader ? cfg.leader : leaders.pop();
    const deck = [];
    for (const id in DEFS) if (DEFS[id].start) for (let k = 0; k < DEFS[id].start; k++) deck.push(mkCard(id));
    G.players.push({
      i, name: human ? '나' : names[i], ai: !human, color: COLORS[i], leader, leaderN: LEADERS[leader].n,
      deck: shuffle(deck), hand: [], discard: [], inPlay: [], revealed: [],
      agentsTotal: 2, agentsAvail: 2, hasSword: false, councilor: false, hooks: false,
      solari: 0, spice: 0, water: 1, vp: n >= 4 ? 1 : 0,
      supply: 9, garrison: 3, conflict: 0, worms: 0, swords: 0, cbonus: 0,
      intrigue: [], spies: 3, inf: { emp: 0, guild: 0, bg: 0, fremen: 0 },
      won: [], objective: { icon: icons[i], up: true }, revealedDone: false,
    });
  }
  if (cfg.easy) for (const p of G.players) if (p.ai) p.garrison = 0, p.supply = 12;
  if (cfg.easy && !G.players[0].ai) drawIntrigue(G.players[0], 0);
  G.first = Math.floor(Math.random() * n);
  // 덱 구성
  const imp = []; for (const id in DEFS) { const d = DEFS[id]; if (!d.start && !d.reserve) for (let k = 0; k < d.count; k++) imp.push(mkCard(id)); }
  G.impDeck = shuffle(imp); for (let k = 0; k < 5; k++) G.row.push(G.impDeck.pop());
  const ints = []; for (const d of INTRIGUE) for (let k = 0; k < d.count; k++) ints.push({ ...d, uid: ++UID });
  G.intDeck = shuffle(ints);
  if (cfg.easy && !G.players[0].ai) drawIntrigue(G.players[0], 1);
  const c1 = shuffle(CONFLICTS[1]).slice(0, 1).map(c => ({ ...c, level: 1 }));
  const c2 = shuffle(CONFLICTS[2]).slice(0, 5).map(c => ({ ...c, level: 2 }));
  const c3 = shuffle(CONFLICTS[3]).map(c => ({ ...c, level: 3 }));
  G.conflictDeck = [...c3, ...c2, ...c1]; // pop()은 끝에서 꺼냄
  log(`게임 시작! 선 플레이어: ${G.players[G.first].name}`, 'imp');
}

async function playRound() {
  G.round++;
  G.conflict = G.conflictDeck.pop();
  log(`━━ ${G.round}라운드 · 분쟁 ${'I'.repeat(G.conflict.level)}: 「${G.conflict.n}」 ━━`, 'round');
  if (G.conflict.loc && G.control[G.conflict.loc] != null) {
    const h = G.players[G.control[G.conflict.loc]];
    if (h.supply > 0) { h.supply--; h.conflict++; log(`${h.name} 방어 보너스: 병력 1 배치`); }
  }
  for (const p of G.players) { draw(p, 5); p.revealedDone = false; p.agentsAvail = p.agentsTotal; }
  UI.render();
  const n = G.players.length;
  const order = []; for (let k = 0; k < n; k++) order.push(G.players[(G.first + k) % n]);
  while (order.some(p => !p.revealedDone)) {
    for (const p of order) {
      if (p.revealedDone) continue;
      G.current = p.i; UI.render();
      if (p.ai) await aiTurn(p); else await UI.waitHuman('turn');
      UI.render();
    }
  }
  G.current = null;
  await combatPhase(order);
  for (const s of ['imperialBasin', 'hagga', 'deep']) if (!G.occ[s].length) G.maker[s]++;
  UI.render();
}

async function combatPhase(order) {
  G.phase = 'combat'; UI.render();
  log('⚔ 전투 단계', 'round');
  let passes = 0, idx = 0, guard = 0;
  while (passes < order.length && guard++ < 60) {
    const p = order[idx % order.length]; idx++;
    const units = p.conflict + p.worms;
    const ci = p.intrigue.filter(x => x.type === 'combat' && (!x.can || x.can(p)));
    if (!units || !ci.length) { passes++; continue; }
    let pick = null;
    if (p.ai) {
      const my = strength(p), others = G.players.filter(x => x !== p).map(strength).sort((a, b) => b - a);
      const top = others[0] || 0;
      if (my <= top) { const c = ci.sort((a, b) => b.str - a.str).find(x => my + x.str > top) || (my + ci.reduce((a, x) => a + x.str, 0) > top ? ci[0] : null); pick = c; }
      else if (my - top <= 2 && G.conflict.level >= 2 && ci.length >= 2) pick = ci[0];
    } else {
      await sleep(100);
      pick = await UI.ask(`전투 음모 카드를 사용할까요? (내 전투력 ${strength(p)} / 최고 상대 ${Math.max(0, ...G.players.filter(x => x !== p).map(strength))})`, [...ci.map(c => ({ label: c.n, sub: c.t, value: c })), { label: '넘기기', value: null }], {});
    }
    if (pick) { await playIntrigue(p, pick); passes = 0; UI.render(); await sleep(SPEED / 2); } else passes++;
  }
  // 보상
  const ps = G.players.map(p => ({ p, s: strength(p) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const groups = []; for (const x of ps) { const g = groups.find(g => g.s === x.s); if (g) g.list.push(x.p); else groups.push({ s: x.s, list: [x.p] }); }
  const four = G.players.length >= 4, C = G.conflict;
  log(`전투력: ${G.players.map(p => `${p.name} ${strength(p)}`).join(' / ')}`);
  if (groups.length) {
    const g1 = groups[0];
    if (g1.list.length > 1) {
      log('1위 동점! 각자 2위 보상', 'imp');
      for (const p of g1.list) await giveReward(p, C.r[1], '2위');
      if (four && g1.list.length === 2 && groups[1] && groups[1].list.length === 1) await giveReward(groups[1].list[0], C.r[2], '3위');
    } else {
      const w = g1.list[0];
      log(`🏆 ${w.name} 분쟁 승리!`, 'imp');
      await giveReward(w, C.r[0], '1위');
      w.won.push({ n: C.n, icon: C.icon, up: true });
      const match = [w.objective, ...w.won.slice(0, -1)].find(x => x.up && x.icon === C.icon);
      if (match) { match.up = false; w.won[w.won.length - 1].up = false; addVP(w, 1, `전투 아이콘 짝(${BATTLE[C.icon]})`); }
      const g2 = groups[1];
      if (g2) {
        if (g2.list.length > 1) { for (const p of g2.list) await giveReward(p, C.r[2], '3위(2위 동점)'); }
        else { await giveReward(g2.list[0], C.r[1], '2위'); if (four && groups[2] && groups[2].list.length === 1) await giveReward(groups[2].list[0], C.r[2], '3위'); }
      }
    }
  } else log('분쟁에 참가한 플레이어가 없습니다');
  for (const p of G.players) { p.supply += p.conflict; p.conflict = 0; p.worms = 0; p.swords = 0; p.cbonus = 0; }
  G.phase = null;
}
async function giveReward(p, items, label) {
  const m = p.worms > 0 ? 2 : 1;
  log(`${p.name} ${label} 보상${m > 1 ? ' (모래벌레로 2배!)' : ''}: ${rewardText(items)}`, 'vp');
  for (const it of items) {
    if (it.vp) addVP(p, it.vp * m, '분쟁');
    if (it.spice) gain(p, 'spice', it.spice * m);
    if (it.solari) gain(p, 'solari', it.solari * m);
    if (it.water) gain(p, 'water', it.water * m);
    if (it.troop) recruit(p, it.troop * m);
    if (it.intrigue) drawIntrigue(p, it.intrigue * m);
    if (it.inf) await chooseInf(p, it.inf * m, `${label} 보상: 영향력을 올릴 세력`);
    if (it.control) { G.control[it.control] = p.i; log(`${p.name}이(가) ${SP[it.control].n}을(를) 장악`); }
    if (it.spiceVP) for (let k = 0; k < m; k++) if (p.spice >= 3 && await askYN(p, '향신료 3을 내고 승점 1을 얻을까요?', true)) { p.spice -= 3; addVP(p, 1, '분쟁 보상'); }
  }
}
function recallPhase() {
  for (const s in G.occ) G.occ[s] = [];
  G.first = (G.first + 1) % G.players.length;
}
async function endgame() {
  log('━━ 게임 종료 ━━', 'round');
  for (const p of G.players) {
    const es = p.intrigue.filter(x => x.type === 'end' && (!x.can || x.can(p)));
    for (const ic of es) {
      if (p.ai || await askYN(p, `종반 음모 「${ic.n}」(${ic.t})를 사용할까요?`, true)) { if (!ic.can || ic.can(p)) await playIntrigue(p, ic); }
    }
  }
  const rank = [...G.players].sort((a, b) => b.vp - a.vp || b.spice - a.spice || b.solari - a.solari || b.water - a.water || b.garrison - a.garrison);
  G.over = true; G.rank = rank;
  log(`승자: ${rank[0].name} (${rank[0].vp}점)`, 'imp');
  UI.render();
}
async function gameLoop() {
  while (true) {
    await playRound();
    if (G.players.some(p => p.vp >= 10) || !G.conflictDeck.length) { await endgame(); return; }
    recallPhase();
  }
}
if (typeof module !== 'undefined') module.exports = { newGame, gameLoop, get G() { return G; }, DEFS, SP };

</script>

let SEL = null, BUSY = false, HIDE = false;

   ${c.xt ? `<div class="ab">${esc(c.xt)}</div>` : ''}
  </button>`;
}

let ZOOM = false;
