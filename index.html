<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보드게임 놀이터</title>
<style>
:root{--ink:#2b2117;--paper:#f3e7cc;--edge:#b89a66;--red:#a8322a;--muted:#7a6a52}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);
  background:#2a1d14 radial-gradient(circle at 30% 0%,#4a3424,#1e140d 70%) fixed}
header{text-align:center;padding:42px 16px 22px;color:#f3e7cc}
header h1{margin:0;font-size:clamp(26px,6vw,40px);letter-spacing:1px}
header p{margin:8px 0 0;opacity:.75;font-size:15px}
.bar{max-width:1080px;margin:0 auto 18px;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:1px solid #6b4f33;background:#fff8e6;font:inherit}
.tag{padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#f3e7cc;font:inherit;font-size:13px;cursor:pointer}
.tag.on{background:#f3e7cc;color:var(--ink);border-color:#f3e7cc;font-weight:700}
.grid{max-width:1080px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--paper);border:2px solid #6b4f33;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,.45)}
.cover{height:130px;display:grid;place-items:center;font-size:62px;position:relative}
.cover .badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font-size:18px}
.body p{margin:0;font-size:13.5px;line-height:1.55;color:#4a3b29;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12px;background:#fffaf0;border:1px solid #d9c49b;border-radius:6px;padding:2px 7px}
.go{margin-top:4px;align-self:flex-start;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:9px}
.card.soon{opacity:.6;pointer-events:none}
.card.soon .go{background:#8a7a62}
.empty{grid-column:1/-1;text-align:center;color:#f3e7cc;opacity:.7;padding:30px}

.sec{grid-column:1/-1;margin:10px 0 -4px;color:#f3e7cc;font-size:18px;border-bottom:1px solid rgba(243,231,204,.25);padding-bottom:8px}
.sec small{font-weight:400;opacity:.6;font-size:13px;margin-left:6px}
.sec.tools{margin-top:22px}
.card.tool{flex-direction:row;border-style:dashed;border-color:#3f9a8f;background:#e7f1ee}
.card.tool .cover{width:96px;height:auto;min-height:96px;font-size:44px;flex:none}
.card.tool .go{background:#2f7f86}
footer{text-align:center;color:#f3e7cc;opacity:.5;font-size:12px;padding:0 16px 28px}
</style>
</head>
<body>
<header>
  <h1>🎲 보드게임 놀이터</h1>
  <p>플레이할 게임이나 도구를 골라 보세요</p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="게임 이름이나 설명으로 검색">
  <div id="tags" style="display:flex;gap:6px;flex-wrap:wrap"></div>
</div>
<main class="grid" id="grid"></main>
<footer>게임 진행 상황은 각자의 브라우저에 저장됩니다.</footer>

<script>
/* ===== 게임 목록 =====
   새 게임을 추가하려면 아래 배열에 { ... } 한 덩어리를 복사해서 붙이고 내용만 바꾸세요.
   - href : 같은 폴더에 올린 게임 파일 이름 (예: 'mygame.html' 또는 'mygame/' 폴더)
   - soon : true 로 두면 '준비 중' 카드로 표시되고 눌리지 않아요
*/
const GAMES = [
  { title:'대항해 탐험가', href:'voyage.html', emoji:'⛵', color:'linear-gradient(135deg,#3e5d74,#6f8fa6)',
    desc:'리스본에서 출항해 12라운드 동안 세계를 누비는 롤 앤 라이트. 물자를 나누고, 해적과 괴혈병을 견디며 명성을 쌓으세요.',
    players:'1인', time:'20~30분', tags:['롤앤라이트','솔로'], badge:'NEW' },
  { title:'스펙터큘러', href:'spectacular.html', emoji:'🐆', color:'linear-gradient(135deg,#2f6b3a,#e0a23a)',
    desc:'멸종위기 동물 공원을 꾸미는 타일·주사위 게임. 컴퓨터와 1:1 대전, 무르기 기능 지원.',
    players:'1인 (vs 컴퓨터)', time:'20~30분', tags:['컴퓨터대전','주사위'], badge:'NEW' },
  { title:'필그림', href:'pilgrims.html', emoji:'🧳', color:'linear-gradient(135deg,#7a3b2a,#d9a45b)',
    desc:'동화 나라를 떠도는 순례자가 되어 아이템과 동료를 모으고 모험을 완수하세요. 컴퓨터 1~3명과 대전, 되돌리기 기능 지원.',
    players:'1인 (vs 컴퓨터 1~3)', time:'20~30분', tags:['컴퓨터대전'], badge:'NEW' },
  { title:'마리 퀴리의 발자취', href:'marie-curie.html', emoji:'⚛️', color:'linear-gradient(135deg,#3a2f4d,#7b3f8c)',
    desc:'마리 퀴리의 연구 인생을 따라가는 자원 관리 게임. 큐브 타워에서 우라늄·라듐을 얻고 논문과 실험으로 점수를 쌓으세요. 컴퓨터 1~3명과 대전, 무르기 지원.',
    players:'1인 (vs 컴퓨터 1~3)', time:'30~40분', tags:['컴퓨터대전'], badge:'NEW' },
  { title:'듄: 임페리움 업라이징', href:'dune.html', emoji:'🐛', color:'linear-gradient(135deg,#5b3b17,#c6902e)',
    desc:'아라키스를 무대로 한 덱빌딩 + 일꾼 놓기 게임. 요원을 보내 세력 영향력을 쌓고, 분쟁에서 승리해 승점 10점을 노리세요. 컴퓨터 1~3명과 대전.',
    players:'1인 (vs 컴퓨터 1~3)', time:'40~60분', tags:['컴퓨터대전','덱빌딩'], badge:'NEW' },
  { title:'스윙 앤 롤', href:'swing-roll.html', emoji:'⚾', color:'linear-gradient(135deg,#1d3f9a,#d8283f)',
    desc:'투수와 타자가 카드를 동시에 내고, 9칸 투구 추적판에서 공이 배트에 걸렸는지로 승부를 가리는 야구 심리전. 판정은 주사위로, 3라운드 또는 7점 선취. 컴퓨터와 1:1 대전, 주사위를 굴리기 전까지 무르기 지원.',
    players:'1인 (vs 컴퓨터)', time:'15~20분', tags:['컴퓨터대전','주사위','심리전'], badge:'NEW' },
  { title:'MLEM 우주 고양이 탐사대', href:'mlem.html', emoji:'🐱', color:'linear-gradient(135deg,#24204a,#7a4fc0)',
    desc:'고양이 우주비행사를 로켓에 태워 달·행성·심우주로 보내는 주사위 밀어붙이기 게임. 더 멀리 갈수록 점수가 크지만 로켓이 추락하면 모두 실패! 언제 내릴지가 승부입니다. 컴퓨터 1~4명과 대전, 무르기 지원.',
    players:'1인 (vs 컴퓨터 1~4)', time:'20~30분', tags:['컴퓨터대전','주사위'], badge:'NEW' },
  { title:'엑스칼리버', href:'excalibur.html', emoji:'⚔️', color:'linear-gradient(135deg,#2c3550,#9aa8c8)',
    desc:'게임이 끝났을 때 엑스칼리버 칩을 쥔 사람이 이기는 블러핑 칩 게임. 칩을 몰래 내고 동시에 공개하며 서로의 손을 훔치고 엿봅니다. 저주받은 검은 피하세요! 컴퓨터 1~5명과 대전, 무르기 지원.',
    players:'1인 (vs 컴퓨터 1~5)', time:'15~20분', tags:['컴퓨터대전','심리전'], badge:'NEW' },
  { title:'라크리모사', href:'lacrimosa.html', emoji:'🎼', color:'linear-gradient(135deg,#2b1f2f,#a0785a)',
    desc:'1791년, 모차르트가 남긴 미완성 레퀴엠. 후원자가 되어 작곡가를 고용하고 레퀴엠 완성을 도우며 점수를 겨루세요. 상대는 극작가 쉬카네더(컴퓨터)입니다.',
    players:'1인 (vs 컴퓨터)', time:'40~60분', tags:['컴퓨터대전','덱빌딩'], badge:'NEW' },
  { title:'드래곤 공방 듀얼', href:'dragon.html', emoji:'🐉', color:'linear-gradient(135deg,#5b1f1f,#b5442f)',
    desc:'드래곤이 일하는 공방 거리에 타일을 놓아 득점 카드의 연결·삼각형 패턴을 완성하는 2인 타일 배치 게임. 코인으로 행동을 늘릴 수 있어요. 컴퓨터와 1:1 대전, 무르기와 팬시 모드 지원.',
    players:'1인 (vs 컴퓨터)', time:'15~20분', tags:['컴퓨터대전','타일'], badge:'업데이트' },
  { title:'하나미', href:'hanmi.html', emoji:'🌸', color:'linear-gradient(135deg,#3b4a2a,#d98aa6)',
    desc:'일본 지도 위 벚꽃 공원 둘레에 타일을 놓아 세력을 넓히고 축제 토큰을 모으는 영향력 게임. 컴퓨터와 하거나, 온라인 방을 만들어 링크로 친구를 불러 함께 할 수 있어요(빈자리는 컴퓨터). 난이도·능력 카드·미니 확장 선택 가능.',
    players:'1~4인 (컴퓨터·온라인 친구)', time:'20~30분', tags:['컴퓨터대전','온라인','타일'], badge:'업데이트' },
  { title:'스코틀랜드 타일 게임', href:'rebirth.html', emoji:'🏴', color:'linear-gradient(135deg,#6a2c12,#d9822b)',
    desc:'스코틀랜드 지도를 옮긴 육각 칸에 농장·정착촌·성·대성당 타일을 놓아 점수와 미션 카드를 노리는 게임. 한 기기로 2~4명이 돌아가며 하거나, 난이도를 고른 컴퓨터와 대전할 수 있어요.',
    players:'1~4인 (컴퓨터 가능)', time:'30~40분', tags:['컴퓨터대전','타일'] },
  { title:'반지의 제왕: 대결', href:'the ring.html', emoji:'💍', color:'linear-gradient(135deg,#4a3a12,#c9a43a)',
    desc:'원정대와 사우론으로 나뉘어 정체를 숨긴 캐릭터를 중간계 지도에 배치하고, 전투 카드로 맞붙는 2인 전략 게임. 프로도가 모르도르에 닿을지, 그 전에 막을지! 컴퓨터와 1:1 대전.',
    players:'1인 (vs 컴퓨터)', time:'20~30분', tags:['컴퓨터대전','심리전'] },
  { title:'캐슬 영토 게임', href:'thecastle.html', emoji:'🏰', color:'linear-gradient(135deg,#2e3442,#6b7690)',
    desc:'9×9 판에 성을 놓아 빈 땅을 둘러싸 영토를 넓히는 추상 전략 게임. 상대 성을 완전히 포위하면 즉시 승리! 바둑과 비슷하지만 더 짧고 빠릅니다. 컴퓨터 난이도 3단계, 무르기 지원.',
    players:'1인 (vs 컴퓨터)', time:'10~15분', tags:['컴퓨터대전','추상전략'] },
  { title:'월면 탐험', href:'themoon.html', emoji:'🌙', color:'linear-gradient(135deg,#1d2340,#4b5a93)',
    desc:'달 표면에 고립된 대원들이 역할 능력을 살려 보급품을 회수하는 협력 게임. 산소통과 산소 카드를 관리하며 경로를 개척하세요. 산소가 떨어지면 임무 실패!',
    players:'1인 (대원 여러 명 조종)', time:'30~40분', tags:['협력','솔로'] },

  { type:'tool', title:'비밀 숫자 배분기', href:'number-dealer.html', emoji:'🔢', color:'linear-gradient(135deg,#1f5b57,#3f9a8f)',
    desc:'인원 수를 정하면 한 명만 다른 숫자를 받아요. 휴대폰을 돌려 가며 자기 숫자만 몰래 확인하는 파티 게임 보조 도구.', players:'3인 이상', tags:[] },
];

const grid=document.getElementById('grid'),q=document.getElementById('q'),tagBox=document.getElementById('tags');
let tag='전체';
const allTags=['전체',...new Set(GAMES.filter(g=>g.type!=='tool').flatMap(g=>g.tags||[]))];
function drawTags(){tagBox.innerHTML=allTags.map(t=>`<button class="tag ${t===tag?'on':''}" data-t="${t}">${t}</button>`).join('');}
tagBox.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tag=b.dataset.t;drawTags();draw();};
function cardHTML(g){
  const tool=g.type==='tool';
  return `<a class="card ${g.soon?'soon':''} ${tool?'tool':''}" href="${g.soon?'#':encodeURI(g.href)}">
      <div class="cover" style="background:${g.color||'#6b4f33'}">${g.emoji||'🎲'}${g.soon?'<span class="badge">준비 중</span>':g.badge?`<span class="badge">${g.badge}</span>`:''}</div>
      <div class="body">
        <h2>${g.title}</h2>
        ${g.desc?`<p>${g.desc}</p>`:'<p></p>'}
        <div class="meta">${g.players?`<span>👥 ${g.players}</span>`:''}${g.time?`<span>⏱ ${g.time}</span>`:''}${(g.tags||[]).map(t=>`<span>#${t}</span>`).join('')}</div>
        <span class="go">${g.soon?'준비 중':tool?'열기 ▶':'플레이 ▶'}</span>
      </div>
    </a>`;
}
function draw(){
  const s=q.value.trim().toLowerCase();
  const ok=g=>(tag==='전체'||(g.tags||[]).includes(tag))&&(!s||(g.title+' '+(g.desc||'')+' '+(g.tags||[]).join(' ')).toLowerCase().includes(s));
  const games=GAMES.filter(g=>g.type!=='tool'&&ok(g)), tools=GAMES.filter(g=>g.type==='tool'&&(!s||(g.title+' '+(g.desc||'')).toLowerCase().includes(s)));
  let h='';
  h+=`<h3 class="sec">🎲 게임 <small>${games.length}</small></h3>`;
  h+=games.length?games.map(cardHTML).join(''):'<div class="empty">찾는 게임이 없어요.</div>';
  if(tools.length){h+=`<h3 class="sec tools">🧰 도구 <small>게임 진행을 돕는 유틸리티</small></h3>`+tools.map(cardHTML).join('');}
  grid.innerHTML=h;
}
q.oninput=draw;drawTags();draw();
</script>
</body>
</html>
